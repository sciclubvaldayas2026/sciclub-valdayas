<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sci Club Val d'Ayas v4.7.1</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-compat.js"></script>
  <style>
    :root {
      --bg: #f8f8f8;
      --bg-card: #ffffff;
      --text: #1a1a1a;
      --text-sec: #666666;
      --border: #e0e0e0;
      --blue-dark: #003d82;
      --blue-mid: #0066cc;
      --blue-light: #e8f1ff;
      --gray-50: #f5f5f5;
      --red: #dc2626;
      --green: #16a34a;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    
    #app {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
      min-height: 100vh;
    }
    
    h1, h2, h3 { margin: 20px 0 10px 0; }
    h1 { font-size: 24px; }
    h2 { font-size: 18px; color: var(--text); }
    h3 { font-size: 14px; color: var(--text-sec); font-weight: 500; }
    
    .btn-primary {
      background: var(--blue-dark);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #002a5c; }
    
    .btn-secondary {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-secondary:hover { background: var(--gray-50); }
    
    .btn-danger {
      background: var(--red);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-danger:hover { background: #991b1b; }
    
    .btn-success {
      background: var(--green);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    .btn-success:hover { background: #15803d; }
    
    input, select, textarea {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 12px;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }
    
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid var(--border);
      border-top-color: var(--blue-dark);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .card {
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    
    .admin-menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .admin-card {
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .admin-card:hover { border-color: var(--blue-mid); background: var(--blue-light); }
    .admin-card-title { font-weight: 600; margin-bottom: 4px; }
    .admin-card-count { font-size: 24px; font-weight: 700; color: var(--blue-dark); }
    
    .user-item {
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .user-info {
      flex: 1;
    }
    .user-name { font-weight: 600; }
    .user-meta { font-size: 12px; color: var(--text-sec); margin-top: 4px; }
    
    .user-actions {
      display: flex;
      gap: 8px;
    }
    
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-pending { background: #fef08a; color: #92400e; }
    .badge-approved { background: #bbf7d0; color: #065f46; }
    .badge-admin { background: #dbeafe; color: #1e40af; }
    .badge-atleta { background: #f3e8ff; color: #5b21b6; }
    .badge-allenatore { background: #fed7aa; color: #92400e; }
    
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .modal {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 24px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }
    
    .modal-header {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      border: none;
      background: var(--gray-50);
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
    }
    
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .stat-box {
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      text-align: center;
    }
    .stat-value { font-size: 28px; font-weight: 700; color: var(--blue-dark); }
    .stat-label { font-size: 12px; color: var(--text-sec); margin-top: 4px; }
  </style>
</head>
<body>
  <div id="app">
    <div style="text-align:center;padding:40px"><div class="spinner"></div></div>
  </div>

  <script>
    // ============ FIREBASE INIT ============
    const firebaseConfig = {
      apiKey: "AIzaSyAb7GSGVmfDEgoRlv6-sx5JHZv3GNfsToU",
      authDomain: "sciclub-valdayas.firebaseapp.com",
      projectId: "sciclub-valdayas",
      storageBucket: "sciclub-valdayas.firebasestorage.app",
      messagingSenderId: "402983337756",
      appId: "1:402983337756:web:bbe2e6a4b0b7a17431c4d9"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    // ============ GLOBALS ============
    var currentUser = null;
    var currentUserData = null;
    var allUsers = [];
    
    const CAT_LABELS = {
      'sbaby': 'S-Baby', 'baby': 'Baby', 'cuccioli': 'Cuccioli',
      'ragazzi': 'Ragazzi', 'allievi': 'Allievi', 'giovani': 'Giovani',
      'giovani_fisi': 'Giovani FISI', 'master': 'Master'
    };
    
    const ALL_CATEGORIES = ['sbaby', 'baby', 'cuccioli', 'ragazzi', 'allievi', 'giovani', 'giovani_fisi', 'master'];

    // ============ AUTH ============
    function showLogin() {
      var html = '<div style="max-width:400px;margin:60px auto">';
      html += '<h1 style="text-align:center;margin-bottom:40px">🏔️ Sci Club Val d\'Ayas</h1>';
      html += '<div class="form-group">';
      html += '<label class="form-label">Email</label>';
      html += '<input type="email" id="login-email" placeholder="tua@email.com">';
      html += '</div>';
      html += '<div class="form-group">';
      html += '<label class="form-label">Password</label>';
      html += '<input type="password" id="login-password" placeholder="•••••••">';
      html += '</div>';
      html += '<button class="btn-primary" onclick="login()" style="width:100%">Login</button>';
      html += '</div>';
      document.getElementById('app').innerHTML = html;
    }

    function login() {
      var email = document.getElementById('login-email').value.trim();
      var password = document.getElementById('login-password').value;
      
      if (!email || !password) {
        alert('Compila email e password');
        return;
      }
      
      auth.signInWithEmailAndPassword(email, password)
        .then(function(result) {
          currentUser = result.user;
          loadUserData();
        })
        .catch(function(error) {
          alert('Errore: ' + error.message);
        });
    }

    function loadUserData() {
      if (!currentUser) return;
      
      db.collection('users').doc(currentUser.uid).get()
        .then(function(doc) {
          if (doc.exists) {
            currentUserData = Object.assign({ uid: currentUser.uid }, doc.data());
            
            // Smart redirect based on role
            if (currentUserData.role === 'admin') {
              showAdminDashboard();
            } else if (currentUserData.role === 'atleta') {
              alert('Accesso atleta non disponibile in questo portale. Usa l\'app principale.');
              logout();
            } else if (currentUserData.role === 'allenatore') {
              alert('Accesso allenatore non disponibile in questo portale. Usa l\'app principale.');
              logout();
            } else {
              alert('Ruolo non riconosciuto');
              logout();
            }
          } else {
            alert('Profilo non trovato');
            logout();
          }
        })
        .catch(function(err) {
          alert('Errore caricamento profilo: ' + err.message);
        });
    }

    function logout() {
      auth.signOut().then(function() {
        currentUser = null;
        currentUserData = null;
        showLogin();
      });
    }

    // ============ ADMIN DASHBOARD ============
    function showAdminDashboard() {
      var html = '<div style="padding:20px">';
      html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px">';
      html += '<h1>🔐 Dashboard Admin</h1>';
      html += '<button class="btn-secondary" onclick="logout()">Logout</button>';
      html += '</div>';
      
      html += '<div class="admin-menu">';
      html += '<div class="admin-card" onclick="loadApprovazioni()">';
      html += '<div class="admin-card-title">⏳ Approvazioni</div>';
      html += '<div id="pending-count" class="admin-card-count">0</div>';
      html += '<div style="font-size:12px;color:var(--text-sec)">In sospeso</div>';
      html += '</div>';
      
      html += '<div class="admin-card" onclick="loadUtenti()">';
      html += '<div class="admin-card-title">👥 Utenti</div>';
      html += '<div id="users-count" class="admin-card-count">0</div>';
      html += '<div style="font-size:12px;color:var(--text-sec)">Totali</div>';
      html += '</div>';
      
      html += '<div class="admin-card" onclick="loadAtleti()">';
      html += '<div class="admin-card-title">🏃 Atleti</div>';
      html += '<div id="atleti-count" class="admin-card-count">0</div>';
      html += '<div style="font-size:12px;color:var(--text-sec)">Registrati</div>';
      html += '</div>';
      
      html += '<div class="admin-card" onclick="loadAllenatori()">';
      html += '<div class="admin-card-title">🏋️ Allenatori</div>';
      html += '<div id="allenatori-count" class="admin-card-count">0</div>';
      html += '<div style="font-size:12px;color:var(--text-sec)">Assegnati</div>';
      html += '</div>';
      html += '</div>';
      
      html += '<div id="admin-content" style="margin-top:24px"></div>';
      html += '</div>';
      
      document.getElementById('app').innerHTML = html;
      
      // Carica statistiche
      loadStats();
      loadApprovazioni();
    }

    function loadStats() {
      db.collection('users').get().then(function(snap) {
        allUsers = [];
        var pending = 0;
        var atleti = 0;
        var allenatori = 0;
        
        snap.docs.forEach(function(doc) {
          var data = Object.assign({ uid: doc.id }, doc.data());
          allUsers.push(data);
          
          if (data.status === 'pending_approval') pending++;
          if (data.role === 'atleta') atleti++;
          if (data.role === 'allenatore') allenatori++;
        });
        
        document.getElementById('pending-count').innerText = pending;
        document.getElementById('users-count').innerText = allUsers.length;
        document.getElementById('atleti-count').innerText = atleti;
        document.getElementById('allenatori-count').innerText = allenatori;
      });
    }

    function loadApprovazioni() {
      var pending = allUsers.filter(function(u) { return u.status === 'pending_approval'; });
      
      var html = '<h2>⏳ In Attesa di Approvazione (' + pending.length + ')</h2>';
      
      if (pending.length === 0) {
        html += '<div style="padding:20px;text-align:center;color:var(--text-sec)">Nessuna approvazione in sospeso</div>';
      } else {
        pending.forEach(function(user) {
          html += '<div class="user-item">';
          html += '<div class="user-info">';
          html += '<div class="user-name">' + user.profileData.nome + ' ' + user.profileData.cognome + '</div>';
          html += '<div class="user-meta">' + user.email + ' • ' + (CAT_LABELS[user.role] || user.role) + '</div>';
          html += '</div>';
          html += '<div class="user-actions">';
          html += '<button class="btn-success" onclick="approveUser(\'' + user.uid + '\')">Approva</button>';
          html += '<button class="btn-danger" onclick="rejectUser(\'' + user.uid + '\')">Rifiuta</button>';
          html += '</div>';
          html += '</div>';
        });
      }
      
      document.getElementById('admin-content').innerHTML = html;
    }

    function loadUtenti() {
      var html = '<h2>👥 Elenco Utenti (' + allUsers.length + ')</h2>';
      
      allUsers.forEach(function(user) {
        var badgeRole = user.role === 'admin' ? 'badge-admin' : user.role === 'atleta' ? 'badge-atleta' : 'badge-allenatore';
        var badgeStatus = user.status === 'approved' ? 'badge-approved' : 'badge-pending';
        
        html += '<div class="user-item">';
        html += '<div class="user-info">';
        html += '<div class="user-name">' + user.profileData.nome + ' ' + user.profileData.cognome + '</div>';
        html += '<div class="user-meta">';
        html += user.email + ' • ';
        html += '<span class="badge ' + badgeRole + '">' + user.role + '</span> ';
        html += '<span class="badge ' + badgeStatus + '">' + user.status + '</span>';
        html += '</div>';
        html += '</div>';
        html += '<div class="user-actions">';
        html += '<button class="btn-primary" onclick="editUser(\'' + user.uid + '\')">Modifica</button>';
        html += '</div>';
        html += '</div>';
      });
      
      document.getElementById('admin-content').innerHTML = html;
    }

    function loadAtleti() {
      // Raccogli TUTTI gli atleti da TUTTI gli user
      var tuttiAtleti = [];
      
      allUsers.forEach(function(user) {
        if (user.atleti && Array.isArray(user.atleti)) {
          user.atleti.forEach(function(atleta) {
            tuttiAtleti.push({
              nome: atleta.nome,
              cognome: atleta.cognome,
              categoria: atleta.categoria,
              genitore: user.profileData.nome + ' ' + user.profileData.cognome,
              genitoreEmail: user.email
            });
          });
        }
      });
      
      var html = '<h2>🏃 Atleti (' + tuttiAtleti.length + ')</h2>';
      
      if (tuttiAtleti.length === 0) {
        html += '<div style="padding:20px;text-align:center;color:var(--text-sec)">Nessun atleta registrato</div>';
      } else {
        tuttiAtleti.forEach(function(atleta) {
          html += '<div class="user-item">';
          html += '<div class="user-info">';
          html += '<div class="user-name">' + atleta.nome + ' ' + atleta.cognome + '</div>';
          html += '<div class="user-meta">';
          html += 'Categoria: <strong>' + (CAT_LABELS[atleta.categoria] || atleta.categoria) + '</strong> • ';
          html += 'Genitore: ' + atleta.genitore + ' (' + atleta.genitoreEmail + ')';
          html += '</div>';
          html += '</div>';
          html += '</div>';
        });
      }
      
      document.getElementById('admin-content').innerHTML = html;
    }

    function loadAllenatori() {
      var allenatori = allUsers.filter(function(u) { 
        return (u.role === 'allenatore' || u.allenatore_categories) && u.status === 'approved'; 
      });
      
      var html = '<h2>🏋️ Allenatori (' + allenatori.length + ')</h2>';
      
      if (allenatori.length === 0) {
        html += '<div style="padding:20px;text-align:center;color:var(--text-sec)">Nessun allenatore approvato</div>';
      } else {
        allenatori.forEach(function(user) {
          var catList = user.allenatore_categories && user.allenatore_categories.length > 0 ? user.allenatore_categories.map(function(c) { return CAT_LABELS[c] || c; }).join(', ') : 'Nessuna';
          
          html += '<div class="user-item">';
          html += '<div class="user-info">';
          html += '<div class="user-name">' + user.profileData.nome + ' ' + user.profileData.cognome + '</div>';
          html += '<div class="user-meta">' + user.email + ' • Categorie: ' + catList + '</div>';
          html += '</div>';
          html += '<div class="user-actions">';
          html += '<button class="btn-primary" onclick="editUser(\'' + user.uid + '\')">Modifica</button>';
          html += '</div>';
          html += '</div>';
        });
      }
      
      document.getElementById('admin-content').innerHTML = html;
    }

    function editUser(uid) {
      var user = allUsers.find(function(u) { return u.uid === uid; });
      if (!user) return;
      
      var html = '<div class="modal-overlay">';
      html += '<div class="modal">';
      html += '<button class="modal-close" onclick="closeModal()">✕</button>';
      html += '<div class="modal-header">Modifica ' + user.profileData.nome + '</div>';
      
      html += '<div class="form-group">';
      html += '<label class="form-label">Ruolo</label>';
      html += '<select id="edit-role">';
      html += '<option value="atleta" ' + (user.role === 'atleta' ? 'selected' : '') + '>Atleta</option>';
      html += '<option value="allenatore" ' + (user.role === 'allenatore' ? 'selected' : '') + '>Allenatore</option>';
      html += '<option value="admin" ' + (user.role === 'admin' ? 'selected' : '') + '>Admin</option>';
      html += '</select>';
      html += '</div>';
      
      html += '<div class="form-group">';
      html += '<label class="form-label">Status</label>';
      html += '<select id="edit-status">';
      html += '<option value="pending_approval" ' + (user.status === 'pending_approval' ? 'selected' : '') + '>In attesa</option>';
      html += '<option value="approved" ' + (user.status === 'approved' ? 'selected' : '') + '>Approvato</option>';
      html += '</select>';
      html += '</div>';
      
      if (user.role === 'allenatore') {
        html += '<div class="form-group">';
        html += '<label class="form-label">Categorie Allenatore</label>';
        html += '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">';
        
        var selectedCats = user.allenatore_categories || [];
        ALL_CATEGORIES.forEach(function(cat) {
          var isChecked = selectedCats.indexOf(cat) >= 0;
          html += '<label style="display:flex;align-items:center;margin-bottom:0">';
          html += '<input type="checkbox" id="cat-' + cat + '" ' + (isChecked ? 'checked' : '') + '> ';
          html += '<span style="margin-left:6px">' + (CAT_LABELS[cat] || cat) + '</span>';
          html += '</label>';
        });
        
        html += '</div>';
        html += '</div>';
      }
      
      html += '<div style="display:flex;gap:12px">';
      html += '<button class="btn-secondary" onclick="closeModal()" style="flex:1">Annulla</button>';
      html += '<button class="btn-primary" onclick="saveUserEdit(\'' + uid + '\')" style="flex:1">Salva</button>';
      html += '</div>';
      html += '</div>';
      html += '</div>';
      
      document.getElementById('app').insertAdjacentHTML('beforeend', html);
    }

    function saveUserEdit(uid) {
      var role = document.getElementById('edit-role').value;
      var status = document.getElementById('edit-status').value;
      var categories = [];
      
      if (role === 'allenatore') {
        ALL_CATEGORIES.forEach(function(cat) {
          if (document.getElementById('cat-' + cat).checked) {
            categories.push(cat);
          }
        });
      }
      
      var updateData = {
        role: role,
        status: status
      };
      
      if (role === 'allenatore') {
        updateData.allenatore_categories = categories;
      }
      
      db.collection('users').doc(uid).update(updateData)
        .then(function() {
          alert('Utente aggiornato!');
          closeModal();
          loadStats();
          loadUtenti();
        })
        .catch(function(err) {
          alert('Errore: ' + err.message);
        });
    }

    function approveUser(uid) {
      db.collection('users').doc(uid).update({
        status: 'approved'
      })
        .then(function() {
          alert('Utente approvato!');
          loadStats();
          loadApprovazioni();
        })
        .catch(function(err) {
          alert('Errore: ' + err.message);
        });
    }

    function rejectUser(uid) {
      if (!confirm('Sei sicuro di voler rifiutare questo utente?')) return;
      
      db.collection('users').doc(uid).delete()
        .then(function() {
          alert('Utente rifiutato e cancellato!');
          loadStats();
          loadApprovazioni();
        })
        .catch(function(err) {
          alert('Errore: ' + err.message);
        });
    }

    function closeModal() {
      var overlay = document.querySelector('.modal-overlay');
      if (overlay) overlay.remove();
    }

    // ============ APP START ============
    auth.onAuthStateChanged(function(user) {
      if (user) {
        currentUser = user;
        loadUserData();
      } else {
        showLogin();
      }
    });
  </script>
</body>
</html>
