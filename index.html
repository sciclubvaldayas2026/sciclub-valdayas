<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --blue:#185FA5;--blue-light:#E6F1FB;--blue-mid:#378ADD;--blue-dark:#0C447C;
  --red:#A32D2D;--red-light:#FCEBEB;
  --teal:#0F6E56;--teal-light:#E1F5EE;--teal-mid:#1D9E75;
  --amber:#854F0B;--amber-light:#FAEEDA;--amber-mid:#EF9F27;
  --gray-50:#F4F3EE;--gray-100:#D3D1C7;--gray-400:#888780;--gray-600:#5F5E5A;--gray-900:#2C2C2A;
  --bg:#F4F3EE;--bg-card:#FFFFFF;--border:rgba(0,0,0,0.08);
  --text:#2C2C2A;--text-sec:#5F5E5A;
  --radius:12px;--radius-sm:8px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--blue-dark)}
#app{height:100%;display:flex;flex-direction:column;max-width:430px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}
.screen{display:none;flex-direction:column;height:100%}
.screen.active{display:flex}
.topbar{background:var(--blue-dark);color:white;padding:52px 16px 14px;display:flex;align-items:flex-end;justify-content:space-between;flex-shrink:0}
.topbar-title{font-size:20px;font-weight:600}
.topbar-sub{font-size:12px;opacity:.65;margin-top:2px}
.avatar-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;cursor:pointer;border:none;color:white;flex-shrink:0}
.navbar{display:flex;background:var(--bg-card);border-top:.5px solid var(--border);padding:8px 0;padding-bottom:calc(8px + var(--safe-bottom));flex-shrink:0}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--text-sec);cursor:pointer;padding:4px 0;border:none;background:none}
.nav-item.active{color:var(--blue-dark)}
.nav-icon{font-size:20px;line-height:1}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* LOGIN */
#screen-login{background:var(--blue-dark);justify-content:flex-end}
.login-hero{padding:60px 24px 32px;text-align:center}
.login-logo{width:72px;height:72px;border-radius:20px;overflow:hidden;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:48px}
.login-title{color:white;font-size:22px;font-weight:600}
.login-sub{color:rgba(255,255,255,.6);font-size:14px;margin-top:4px}
.login-card{background:var(--bg-card);border-radius:24px 24px 0 0;padding:28px 20px calc(28px + var(--safe-bottom));display:flex;flex-direction:column;gap:16px}
.field-label{font-size:12px;color:var(--text-sec);margin-bottom:5px}
.field-input{width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:.5px solid var(--border);font-size:15px;background:var(--bg);color:var(--text);outline:none;font-family:inherit}
.field-input:focus{border-color:var(--blue-mid);background:white}
.btn-primary{width:100%;padding:14px;border-radius:var(--radius-sm);background:var(--blue-dark);color:white;font-size:15px;font-weight:600;border:none;cursor:pointer}
.btn-link{text-align:center;font-size:13px;color:var(--text-sec);cursor:pointer}
.btn-link span{color:var(--blue-mid);font-weight:500;cursor:pointer}
.error-msg{background:var(--red-light);color:var(--red);font-size:13px;padding:10px 12px;border-radius:var(--radius-sm);display:none}

/* CHIPS */
.chips-row{display:flex;gap:8px;padding:12px 14px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.chips-row::-webkit-scrollbar{display:none}
.chip{padding:7px 16px;border-radius:20px;font-size:13px;font-weight:500;white-space:nowrap;border:.5px solid var(--border);cursor:pointer;background:var(--bg-card);color:var(--text-sec)}
.chip.active{background:var(--blue-dark);color:white;border-color:var(--blue-dark)}

/* EVENTS */
.month-label{padding:14px 14px 4px;font-size:13px;font-weight:600;color:var(--text-sec)}
.event-card{margin:0 12px 8px;background:var(--bg-card);border-radius:var(--radius);border:.5px solid var(--border);padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.event-date{width:42px;text-align:center;flex-shrink:0}
.event-day-num{font-size:22px;font-weight:600;color:var(--text);line-height:1}
.event-day-name{font-size:10px;color:var(--text-sec);margin-top:2px;text-transform:uppercase;letter-spacing:.3px}
.event-bar{width:3px;align-self:stretch;border-radius:2px;flex-shrink:0}
.event-info{flex:1;min-width:0}
.event-title{font-size:15px;font-weight:500;color:var(--text)}
.event-sub{font-size:12px;color:var(--text-sec);margin-top:2px}
.event-badge{font-size:10px;padding:3px 9px;border-radius:10px;font-weight:500;flex-shrink:0}
.badge-info{background:var(--gray-400)}

/* MODAL */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:1000}
.modal-overlay.active{display:flex}
.modal-card{background:white;border-radius:var(--radius);padding:24px;max-width:90vw;max-height:80vh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:var(--gray-50);border:none;cursor:pointer;font-size:16px}

/* ADMIN */
.admin-tabs{display:flex;gap:4px;padding:12px 14px;overflow-x:auto;scrollbar-width:none;border-bottom:.5px solid var(--border)}
.admin-tabs::-webkit-scrollbar{display:none}
.admin-tab{padding:10px 14px;border-radius:var(--radius-sm);border:.5px solid var(--border);font-size:13px;font-weight:500;cursor:pointer;background:var(--bg-card);color:var(--text-sec);white-space:nowrap}
.admin-tab.active{background:var(--blue-dark);color:white;border-color:var(--blue-dark)}
.admin-section{padding:14px}
.admin-card{background:var(--bg-card);border-radius:var(--radius);border:.5px solid var(--border);padding:16px;margin-bottom:12px}
.admin-card-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:12px}
.btn-sm{padding:10px 14px;border-radius:var(--radius-sm);border:.5px solid var(--border);font-size:13px;background:var(--bg-card);color:var(--text);cursor:pointer}
.btn-sm.green{background:var(--teal);color:white;border-color:var(--teal)}
.dropzone{border:2px dashed var(--gray-100);border-radius:var(--radius);padding:24px;text-align:center;cursor:pointer;background:var(--bg)}
.dropzone.active{background:var(--blue-light);border-color:var(--blue-mid)}
.dropzone-text{font-size:14px;color:var(--text-sec)}
#file-input{display:none}

/* EMPTY STATE */
.empty-state{padding:60px 20px;text-align:center;color:var(--text-sec)}
.empty-state-icon{font-size:48px;margin-bottom:12px}

/* UTILITY */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--gray-100);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-msg{text-align:center;padding:20px;color:var(--text-sec);font-size:13px}
.sync-status{background:var(--blue-light);color:var(--blue-dark);padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:12px;font-size:13px}
</style>

</head>

// ============ AUTH ============
function login() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  
  if (!email || !password) {
    showLoginError('Email e password obbligatori');
    return;
  }
  
  auth.signInWithEmailAndPassword(email, password)
    .then(function(userCred) {
      currentUser = userCred.user;
      loadUserData();
      syncGoogleDriveStructure();
    })
    .catch(function(err) {
      showLoginError(err.message);
    });
}

function logout() {
  auth.signOut().then(function() {
    currentUser = null;
    currentRole = null;
    document.getElementById('login-email').value = '';
    document.getElementById('login-password').value = '';
    showScreen('login');
    hideProfile();
  });
}

function showLoginError(msg) {
  const errorEl = document.getElementById('login-error');
  errorEl.textContent = msg;
  errorEl.style.display = 'block';
  setTimeout(() => errorEl.style.display = 'none', 5000);
}

function loadUserData() {
  db.collection('users').doc(currentUser.uid).get().then(function(snap) {
    if (!snap.exists) {
      showLoginError('Utente non trovato nel database');

async function downloadFileFromGoogleDrive(fileId) {
  try {
    // Usa l'endpoint di export Google Sheets (funziona con CORS)
    const url = `https://docs.google.com/spreadsheets/d/${fileId}/export?format=xlsx`;
    const response = await fetch(url);
    if (!response.ok) throw new Error('Download fallito (status ' + response.status + ')');
    return await response.arrayBuffer();
  } catch (err) {
    console.error('Errore download:', err);
    return null;
  }
}

function saveAttendance(eventId, category, athleteCount) {
  const attendance = {};
  for (let i = 0; i < athleteCount; i++) {
    const checkbox = document.getElementById('presence-' + i);
    if (checkbox && checkbox.checked) {
      attendance[i] = true;
    }
  }
  
  db.collection('attendance').doc(eventId + '_' + category).set({
    eventId: eventId,
    category: category,
    attendance: attendance,
    recordedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    showPresenzeSuccess('✅ Presenze salvate!');
  }).catch(err => {
    showPresenzeError('Errore: ' + err.message);
  });
}

function exportPresenze(eventId, category, athleteCount) {
  db.collection('config').doc('athletes').get().then(function(snap) {
    if (!snap.exists) {
      showPresenzeError('Atleti non trovati.');
      return;
    }
    
    const athletes = snap.data().athletes[category] || [];
    const attendance = {};
    
    for (let i = 0; i < athleteCount; i++) {
      const checkbox = document.getElementById('presence-' + i);
      if (checkbox) attendance[i] = checkbox.checked;
    }
    
    // Genera CSV
    let csv = 'Evento,Data,Categoria,Atleta,Presente\n';
    
    db.collection('events').doc(eventId).get().then(function(eventSnap) {
      const event = eventSnap.data();
      
      athletes.forEach((athlete, idx) => {
        const isPresent = attendance[idx] === true ? 'Si' : 'No';
        const athleteName = athlete.surname + ' ' + athlete.name;
        csv += `"${event.title}","${event.date}","${CAT_LABELS[category]}","${athleteName}","${isPresent}"\n`;
      });
      
      // Salva su Google Drive (simulato per ora - vedi funzione uploadToGoogleDrive)
      uploadPresenceToGoogleDrive(eventId, category, csv);
      
      // Scarica localmente
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Presenze_${event.date}_${category}.csv`;
      a.click();
      window.URL.revokeObjectURL(url);
    });
  });
}

async function syncAtletiFromDrive() {
  const statusEl = document.getElementById('sync-status');
  statusEl.innerHTML = '<div class="loading-msg"><div class="spinner"></div> Scaricando atleti da Google Drive...</div>';
  
  try {
    const arrayBuffer = await downloadFileFromGoogleDrive(ATLETI_FILE_ID);
    if (!arrayBuffer) throw new Error('Errore nel download del file');
    
    // Parsa XLSX
    const data = new Uint8Array(arrayBuffer);
    const workbook = XLSX.read(data, { type: 'array' });
    
    const athletes = {};
    ALL_CATEGORIES.forEach(cat => athletes[cat] = []);
    
    workbook.SheetNames.forEach(function(sheetName) {
      const sheet = workbook.Sheets[sheetName];
      const allRows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      
      if (allRows.length < 3) return;
      
      const headerRow = allRows[1];
      const cognomeIdx = headerRow.indexOf('COGNOME');
      const nomeIdx = headerRow.indexOf('NOME');
      
      if (cognomeIdx < 0 || nomeIdx < 0) return;
      
      // Usa il mapping SHEET_TO_CATEGORY per convertire il nome sheet a categoria interna
      const sheetNameUpper = sheetName.toUpperCase().trim();
      const category = SHEET_TO_CATEGORY[sheetNameUpper];
      
      if (!category) {
        console.log('⚠️ Sheet non mappato: ' + sheetName);
        return;
      }
      
      for (let i = 2; i < allRows.length; i++) {
        const row = allRows[i];
        const cognome = (row[cognomeIdx] || '').trim();
        const nome = (row[nomeIdx] || '').trim();
        
        if (cognome || nome) {
          athletes[category].push({
            name: nome,
            surname: cognome,
            category: category
          });
        }
      }
    });
    
    // Salva su Firestore
    await db.collection('config').doc('athletes').set({ athletes: athletes });
    const totalAthletes = Object.values(athletes).reduce((a, b) => a + b.length, 0);
    statusEl.innerHTML = '<div style="background:var(--teal-light);color:var(--teal);padding:10px;border-radius:var(--radius-sm);font-size:13px">✅ ' + totalAthletes + ' atleti sincronizzati da Google Drive!</div>';

}

async function syncProgrammaFromDrive() {
  const statusEl = document.getElementById('sync-status');
  statusEl.innerHTML = '<div class="loading-msg"><div class="spinner"></div> Scaricando programma da Google Drive...</div>';
  
  try {
    const arrayBuffer = await downloadFileFromGoogleDrive(PROGRAMMA_FILE_ID);
    if (!arrayBuffer) throw new Error('Errore nel download del file');
    
    const data = new Uint8Array(arrayBuffer);
    const workbook = XLSX.read(data, { type: 'array' });
    
    // Mappa colori a attività
    const colorActivityMap = {
      'FFFF00': 'sci',           // Giallo = SCI
      'FFFF99': 'sci',           // Giallo chiaro = SCI
      'FFC000': 'sci',           // Arancione-giallo = SCI
      '00B050': 'atletica',      // Verde = ATLETICA
      '00B0F0': 'acrobatica',    // Azzurro = ACROBATICA
      'FF7F00': 'multisport',    // Arancione = MULTISPORT
    };
    
    const events = [];
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const allRows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
    
    // Riga 1 (indice 0): Mesi
    const monthRow = allRows[0] || [];
    // Riga 3 (indice 2): Categorie
    const categoryRow = allRows[2] || [];
    
    // Estrai i mesi e le loro colonne di inizio
    const months = [];
    let currentMonth = null;
    let monthStartCol = 0;
    
    for (let colIdx = 0; colIdx < monthRow.length; colIdx++) {
      const monthCell = (monthRow[colIdx] || '').toString().trim().toUpperCase();
      if (monthCell && monthCell.length > 0 && ['GENNAIO', 'FEBBRAIO', 'MARZO', 'APRILE', 'MAGGIO', 'GIUGNO', 'LUGLIO', 'AGOSTO', 'SETTEMBRE', 'OTTOBRE', 'NOVEMBRE', 'DICEMBRE'].includes(monthCell)) {
        if (currentMonth) {
          currentMonth.endCol = colIdx - 1;
          months.push(currentMonth);
        }
        currentMonth = { name: monthCell, startCol: colIdx, endCol: colIdx };
      }
    }
    if (currentMonth) {
      currentMonth.endCol = monthRow.length - 1;
      months.push(currentMonth);
    }
    
    // Per ogni mese, leggi le attività
    months.forEach(monthData => {
      const monthName = monthData.name.toLowerCase();
      const monthNum = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'].indexOf(monthName) + 1;
      const year = 2026; // Puoi renderlo dinamico se necessario
      
      // Estrai categorie per questo mese (dalla riga 3, colonne rilevanti)
      const monthCategories = [];
      for (let colIdx = monthData.startCol; colIdx <= monthData.endCol; colIdx++) {
        const catCell = (categoryRow[colIdx] || '').toString().trim().toUpperCase();
        if (catCell && ALL_CATEGORIES.includes(catCell.toLowerCase())) {
          monthCategories.push({
            col: colIdx,
            name: catCell.toLowerCase()
          });
        }
      }
      
      // Leggi attività per ogni categoria (righe 11-41, indici 10-40)
      for (let rowIdx = 10; rowIdx <= 40 && rowIdx < allRows.length; rowIdx++) {
        const row = allRows[rowIdx] || [];
        
        // Leggi il giorno dalla colonna A o B del mese (dovrebbe essere in monthData.startCol e startCol+1)
        const dayNumCell = (row[monthData.startCol] || '').toString().trim();
        const dayNameCell = (row[monthData.startCol + 1] || '').toString().trim();
        
        // Se non c'è numero di giorno, salta questa riga
        const dayNum = parseInt(dayNumCell);
        if (isNaN(dayNum) || dayNum < 1 || dayNum > 31) continue;
        
        // Crea la data
        const dateStr = String(year) + '-' + String(monthNum).padStart(2, '0') + '-' + String(dayNum).padStart(2, '0');
        
        // Per ogni categoria, leggi l'attività
        monthCategories.forEach(catInfo => {
          const activityCell = (row[catInfo.col] || '').toString().trim();
          
          if (activityCell && activityCell.length > 0 && activityCell !== 'R') {
            // Determina il tipo e colore
            let activityType = 'sci'; // default
            let color = '#FFC000'; // default giallo
            
            const cellUpper = activityCell.toUpperCase();
            if (cellUpper.includes('ATLETICA')) {
              activityType = 'atletica';
              color = '#00B050'; // Verde
            } else if (cellUpper.includes('ACROBATICA') || cellUpper.includes('CAMPUS')) {
              activityType = 'acrobatica';
              color = '#00B0F0'; // Azzurro
            } else if (cellUpper.includes('MULTISPORT')) {
              activityType = 'multisport';
              color = '#FF7F00'; // Arancione
            } else {
              activityType = 'sci';
              color = '#FFC000'; // Giallo
            }
            
            events.push({
              date: dateStr,
              category: catInfo.name,
              title: activityCell,
              type: activityType,
              color: color,
              createdAt: new Date()
            });
          }
        });
      }
    });
    
    // Salva gli eventi in Firestore
    if (events.length > 0) {
      // Elimina gli eventi vecchi
      const deletePromises = [];
      const existingEventsSnap = await db.collection('events').get();
      existingEventsSnap.forEach(doc => {
        deletePromises.push(doc.ref.delete());
      });
      
      await Promise.all(deletePromises);
      
      // Salva i nuovi eventi
      const batch = db.batch();
      events.forEach((event, idx) => {
        const docRef = db.collection('events').doc(String(idx));
        batch.set(docRef, event);
      });
      
      await batch.commit();
      
      statusEl.innerHTML = '<div style="background:var(--teal-light);color:var(--teal);padding:10px;border-radius:var(--radius-sm);font-size:13px">✅ ' + events.length + ' eventi del programma sincronizzati da Google Drive!</div>';
    } else {
      statusEl.innerHTML = '<div style="background:var(--amber-light);color:var(--amber);padding:10px;border-radius:var(--radius-sm);font-size:13px">⚠️ Nessun evento trovato nel programma</div>';
    }
    
  } catch (err) {
    console.error('Errore parsing programma:', err);
    statusEl.innerHTML = '<div style="background:var(--red-light);color:var(--red);padding:10px;border-radius:var(--radius-sm);font-size:13px">❌ Errore: ' + err.message + '</div>';
  }
}

function handleDragOver(e) {
  e.preventDefault();
  e.target.closest('.dropzone').classList.add('active');
}

function handleDragLeave(e) {
  e.target.closest('.dropzone').classList.remove('active');
}

function handleFileDrop(e) {
  e.preventDefault();
  e.target.closest('.dropzone').classList.remove('active');
  if (e.dataTransfer.files.length) processFile(e.dataTransfer.files[0]);
}

function handleFileSelect(e) {
  if (e.target.files.length) processFile(e.target.files[0]);
}

function processFile(file) {
  const reader = new FileReader();
  reader.onload = function(e) {
    try {
      const data = new Uint8Array(e.target.result);
      const workbook = XLSX.read(data, { type: 'array' });
      
      const athletes = {};
      ALL_CATEGORIES.forEach(cat => athletes[cat] = []);
      
      workbook.SheetNames.forEach(function(sheetName) {
        const sheet = workbook.Sheets[sheetName];
        const allRows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        
        if (allRows.length < 3) return;
        
        const headerRow = allRows[1];
        const cognomeIdx = headerRow.indexOf('COGNOME');
        const nomeIdx = headerRow.indexOf('NOME');
        
        if (cognomeIdx < 0 || nomeIdx < 0) return;
        
        // Usa il mapping SHEET_TO_CATEGORY
        const sheetNameUpper = sheetName.toUpperCase().trim();
        const category = SHEET_TO_CATEGORY[sheetNameUpper];
        
        if (!category) {
          console.log('⚠️ Sheet non mappato: ' + sheetName);
          return;
        }
        
        for (let i = 2; i < allRows.length; i++) {
          const row = allRows[i];
          const cognome = (row[cognomeIdx] || '').trim();
          const nome = (row[nomeIdx] || '').trim();
          
          if (cognome || nome) {
            athletes[category].push({
              name: nome,
              surname: cognome,
              category: category
            });
          }
        }
      });
      
      db.collection('config').doc('athletes').set({ athletes: athletes }).then(() => {
        const totalAthletes = Object.values(athletes).reduce((a, b) => a + b.length, 0);
        document.getElementById('import-status').innerHTML = '<div style="background:var(--teal-light);color:var(--teal);padding:10px;border-radius:var(--radius-sm);font-size:13px">✅ ' + totalAthletes + ' atleti importati!</div>';
      });
    } catch (err) {
      document.getElementById('import-status').innerHTML = '<div style="background:var(--red-light);color:var(--red);padding:10px;border-radius:var(--radius-sm);font-size:13px">❌ Errore: ' + err.message + '</div>';
    }
  };
  reader.readAsArrayBuffer(file);
}

function openMediciModal(cat) {
  db.collection('config').doc('athletes').get().then(function(snap) {
    if (!snap.exists) return;
    
    const athletes = snap.data().athletes[cat] || [];
    let html = '<div style="margin-bottom:16px"><div style="font-size:16px;font-weight:600">' + CAT_LABELS[cat] + ' - Certificati medici</div></div>';
    
    const byStatus = { scaduti: [], inScadenza: [], validi: [], nonInseriti: [] };
    
    athletes.forEach(a => {
      if (!a.medicalExpiry) {
        byStatus.nonInseriti.push(a);
      } else {
        const exp = new Date(a.medicalExpiry);
        const diff = Math.ceil((exp - new Date()) / (1000 * 60 * 60 * 24));
        if (diff < 0) byStatus.scaduti.push(a);
        else if (diff < 30) byStatus.inScadenza.push(a);
        else byStatus.validi.push(a);
      }
    });
    
    const sections = [
      { title: '🔴 Scaduti', data: byStatus.scaduti, color: 'var(--red)' },
      { title: '🟡 In scadenza', data: byStatus.inScadenza, color: 'var(--amber-mid)' },
      { title: '🟢 Validi', data: byStatus.validi, color: 'var(--teal)' },
      { title: '⚪ Non inseriti', data: byStatus.nonInseriti, color: 'var(--gray-400)' }
    ];
    
    sections.forEach(sec => {
      if (sec.data.length > 0) {
        html += '<div style="margin-top:16px"><div style="font-size:13px;font-weight:600;color:' + sec.color + ';">' + sec.title + ' (' + sec.data.length + ')</div>';
        sec.data.forEach(a => {
          html += '<div style="padding:8px 0;border-bottom:.5px solid var(--border);font-size:13px">' +
            '<div style="font-weight:500">' + a.surname + ' ' + a.name + '</div>' +
            '<div style="color:var(--text-sec);font-size:12px">' + (a.medicalExpiry ? new Date(a.medicalExpiry).toLocaleDateString('it-IT') : 'N/A') + '</div>' +
            '</div>';
        });
        html += '</div>';
      }
    });
    
    document.getElementById('event-modal-content').innerHTML = html;
    document.getElementById('event-modal').classList.add('active');
  });
}
