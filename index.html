<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{
  --blue:#185FA5;--blue-light:#E6F1FB;--blue-mid:#378ADD;--blue-dark:#0C447C;
  --red:#A32D2D;--red-light:#FCEBEB;
  --teal:#0F6E56;--teal-light:#E1F5EE;--teal-mid:#1D9E75;
  --amber:#854F0B;--amber-light:#FAEEDA;--amber-mid:#EF9F27;
  --gray-50:#F4F3EE;--gray-100:#D3D1C7;--gray-400:#888780;--gray-600:#5F5E5A;--gray-900:#2C2C2A;
  --bg:#F4F3EE;--bg-card:#FFFFFF;--border:rgba(0,0,0,0.08);
  --text:#2C2C2A;--text-sec:#5F5E5A;
  --radius:12px;--radius-sm:8px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
html,body{height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:var(--blue-dark)}
#app{height:100%;display:flex;flex-direction:column;max-width:430px;margin:0 auto;background:var(--bg);position:relative;overflow:hidden}
.screen{display:none;flex-direction:column;height:100%}
.screen.active{display:flex}
.topbar{background:var(--blue-dark);color:white;padding:52px 16px 14px;display:flex;align-items:flex-end;justify-content:space-between;flex-shrink:0}
.topbar-title{font-size:20px;font-weight:600}
.topbar-sub{font-size:12px;opacity:.65;margin-top:2px}
.avatar-btn{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;cursor:pointer;border:none;color:white;flex-shrink:0}
.navbar{display:flex;background:var(--bg-card);border-top:.5px solid var(--border);padding:8px 0;padding-bottom:calc(8px + var(--safe-bottom));flex-shrink:0}
.nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--text-sec);cursor:pointer;padding:4px 0;border:none;background:none}
.nav-item.active{color:var(--blue-dark)}
.nav-icon{font-size:20px;line-height:1}
.content{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* LOGIN */
#screen-login{background:var(--blue-dark);justify-content:flex-end}
.login-hero{padding:60px 24px 32px;text-align:center}
.login-logo{width:72px;height:72px;border-radius:20px;overflow:hidden;margin:0 auto 16px;display:flex;align-items:center;justify-content:center;font-size:48px}
.login-title{color:white;font-size:22px;font-weight:600}
.login-sub{color:rgba(255,255,255,.6);font-size:14px;margin-top:4px}
.login-card{background:var(--bg-card);border-radius:24px 24px 0 0;padding:28px 20px calc(28px + var(--safe-bottom));display:flex;flex-direction:column;gap:16px}
.field-label{font-size:12px;color:var(--text-sec);margin-bottom:5px}
.field-input{width:100%;padding:12px 14px;border-radius:var(--radius-sm);border:.5px solid var(--border);font-size:15px;background:var(--bg);color:var(--text);outline:none;font-family:inherit}
.field-input:focus{border-color:var(--blue-mid);background:white}
.btn-primary{width:100%;padding:14px;border-radius:var(--radius-sm);background:var(--blue-dark);color:white;font-size:15px;font-weight:600;border:none;cursor:pointer}
.btn-link{text-align:center;font-size:13px;color:var(--text-sec);cursor:pointer}
.btn-link span{color:var(--blue-mid);font-weight:500;cursor:pointer}
.error-msg{background:var(--red-light);color:var(--red);font-size:13px;padding:10px 12px;border-radius:var(--radius-sm);display:none}

/* CHIPS */
.chips-row{display:flex;gap:8px;padding:12px 14px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.chips-row::-webkit-scrollbar{display:none}
.chip{padding:7px 16px;border-radius:20px;font-size:13px;font-weight:500;white-space:nowrap;border:.5px solid var(--border);cursor:pointer;background:var(--bg-card);color:var(--text-sec)}
.chip.active{background:var(--blue-dark);color:white;border-color:var(--blue-dark)}

/* EVENTS */
.month-label{padding:14px 14px 4px;font-size:13px;font-weight:600;color:var(--text-sec)}
.event-card{margin:0 12px 8px;background:var(--bg-card);border-radius:var(--radius);border:.5px solid var(--border);padding:12px 14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.event-date{width:42px;text-align:center;flex-shrink:0}
.event-day-num{font-size:22px;font-weight:600;color:var(--text);line-height:1}
.event-day-name{font-size:10px;color:var(--text-sec);margin-top:2px;text-transform:uppercase;letter-spacing:.3px}
.event-bar{width:3px;align-self:stretch;border-radius:2px;flex-shrink:0}
.event-info{flex:1;min-width:0}
.event-title{font-size:15px;font-weight:500;color:var(--text)}
.event-sub{font-size:12px;color:var(--text-sec);margin-top:2px}
.event-badge{font-size:10px;padding:3px 9px;border-radius:10px;font-weight:500;flex-shrink:0}
.badge-info{background:var(--gray-400)}

/* MODAL */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:1000}
.modal-overlay.active{display:flex}
.modal-card{background:white;border-radius:var(--radius);padding:24px;max-width:90vw;max-height:80vh;overflow-y:auto;position:relative}
.modal-close{position:absolute;top:12px;right:12px;width:32px;height:32px;border-radius:50%;background:var(--gray-50);border:none;cursor:pointer;font-size:16px}

/* ADMIN */
.admin-tabs{display:flex;gap:4px;padding:12px 14px;overflow-x:auto;scrollbar-width:none;border-bottom:.5px solid var(--border)}
.admin-tabs::-webkit-scrollbar{display:none}
.admin-tab{padding:10px 14px;border-radius:var(--radius-sm);border:.5px solid var(--border);font-size:13px;font-weight:500;cursor:pointer;background:var(--bg-card);color:var(--text-sec);white-space:nowrap}
.admin-tab.active{background:var(--blue-dark);color:white;border-color:var(--blue-dark)}
.admin-section{padding:14px}
.admin-card{background:var(--bg-card);border-radius:var(--radius);border:.5px solid var(--border);padding:16px;margin-bottom:12px}
.admin-card-title{font-size:14px;font-weight:600;color:var(--text);margin-bottom:12px}
.btn-sm{padding:10px 14px;border-radius:var(--radius-sm);border:.5px solid var(--border);font-size:13px;background:var(--bg-card);color:var(--text);cursor:pointer}
.btn-sm.green{background:var(--teal);color:white;border-color:var(--teal)}
.dropzone{border:2px dashed var(--gray-100);border-radius:var(--radius);padding:24px;text-align:center;cursor:pointer;background:var(--bg)}
.dropzone.active{background:var(--blue-light);border-color:var(--blue-mid)}
.dropzone-text{font-size:14px;color:var(--text-sec)}
#file-input{display:none}

/* EMPTY STATE */
.empty-state{padding:60px 20px;text-align:center;color:var(--text-sec)}
.empty-state-icon{font-size:48px;margin-bottom:12px}

/* UTILITY */
.spinner{display:inline-block;width:16px;height:16px;border:2px solid var(--gray-100);border-top-color:var(--blue);border-radius:50%;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.loading-msg{text-align:center;padding:20px;color:var(--text-sec);font-size:13px}
.sync-status{background:var(--blue-light);color:var(--blue-dark);padding:10px 14px;border-radius:var(--radius-sm);margin-bottom:12px;font-size:13px}
</style>

</head>
<body>

</div>

<!-- PROFILE MODAL -->
<div id="profile-modal" class="modal-overlay">
  <div class="modal-card">
    <button class="modal-close" onclick="hideProfile()">✕</button>
    <div id="profile-content" style="padding-top:20px"></div>

</div>

<!-- EVENT MODAL -->
<div id="event-modal" class="modal-overlay">

<script>
// ============ FIREBASE CONFIG ============
const firebaseConfig = {
  apiKey: "AIzaSyAb7GSGVmfDEgoRlv6-sx5JHZv3GNfsToU",
  authDomain: "sciclub-valdayas.firebaseapp.com",
  projectId: "sciclub-valdayas",
  storageBucket: "sciclub-valdayas.firebasestorage.app",
  messagingSenderId: "402983337756",
  appId: "1:402983337756:web:bbe2e6a4b0b7a17431c4d9"
};

firebase.initializeApp(firebaseConfig);
const auth = firebase.auth();
const db = firebase.firestore();

// ============ GOOGLE DRIVE CONFIG ============
const GOOGLE_DRIVE_FOLDER_ID = '1PPhFjNiPr2nMhekTd6WLhQRFUGDMq1-g';
const PRESENZE_FOLDER_NAME = 'Presenze';

// File ID diretti da Google Drive
const ATLETI_FILE_ID = '1qz7Rf-upeL6yhie3p6c72rEu5lcoz5Gg';
const PROGRAMMA_FILE_ID = '17112nlUQ8o2phkyAhs4S4S_QxzUxZwHJ';

// ============ GLOBALS ============
let currentUser = null;
let currentRole = null;
let importedAthletes = {};
let googleDrivePresenzeFolderId = null;
let selectedGenitoreChip = 'all';
let selectedAllenatoreChip = 'all';
let adminTab = 'drive';

const CAT_LABELS = {
  sbaby: 'S.Baby',
  baby: 'Baby',
  cuccioli: 'Cuccioli',
  ragazzi: 'Ragazzi',
  allievi: 'Allievi',
  giovani: 'Giovani FIS',
  giovani_fisi: 'Giovani FISI',
  master: 'Master'
};

const ALL_CATEGORIES = ['sbaby', 'baby', 'cuccioli', 'ragazzi', 'allievi', 'giovani', 'giovani_fisi', 'master'];

// ============ AUTH ============
function login() {
  const email = document.getElementById('login-email').value.trim();
  const password = document.getElementById('login-password').value;
  
  if (!email || !password) {
    showLoginError('Email e password obbligatori');
    return;
  }
  
  auth.signInWithEmailAndPassword(email, password)
    .then(function(userCred) {
      currentUser = userCred.user;
      loadUserData();
      syncGoogleDriveStructure();
    })
    .catch(function(err) {
      showLoginError(err.message);
    });
}

function logout() {
  auth.signOut().then(function() {
    currentUser = null;
    currentRole = null;
    document.getElementById('login-email').value = '';
    document.getElementById('login-password').value = '';
    showScreen('login');
    hideProfile();
  });
}

function showLoginError(msg) {
  const errorEl = document.getElementById('login-error');
  errorEl.textContent = msg;
  errorEl.style.display = 'block';
  setTimeout(() => errorEl.style.display = 'none', 5000);
}

function loadUserData() {
  db.collection('users').doc(currentUser.uid).get().then(function(snap) {
    if (!snap.exists) {
      showLoginError('Utente non trovato nel database');
      return;
    }
    
    const userData = snap.data();
    
    // Se multiRole, chiedi quale ruolo usare
    if (userData.multiRole && userData.multiRole.length > 1) {
      showRoleSelector(userData);
    } else {
      currentRole = userData.multiRole ? userData.multiRole[0] : 'genitore';
      showHomeScreen();
    }
  });
}

function showRoleSelector(userData) {
  let html = '<div style="text-align:center;padding:20px"><div style="font-size:16px;font-weight:600;margin-bottom:20px">Scegli il tuo ruolo</div>';
  userData.multiRole.forEach(role => {
    html += '<button class="btn-primary" style="margin-bottom:10px" onclick="setUserRole(\'' + role + '\')">' + 
      (role === 'genitore' ? '👨‍👩‍👧‍👦 Genitore' : '⛷️ Allenatore') + '</button>';
  });
  html += '</div>';
  document.getElementById('event-modal-content').innerHTML = html;
  document.getElementById('event-modal').classList.add('active');
}

function setUserRole(role) {
  currentRole = role;
  db.collection('users').doc(currentUser.uid).update({ preferredRole: role });
  hideEventModal();
  showHomeScreen();
}

function showHomeScreen() {
  const screen = currentRole === 'admin' ? 'admin' : (currentRole === 'allenatore' ? 'allenatore' : 'genitore');
  showScreen(screen);
  
  if (screen === 'genitore') {
    loadGenitoreData();
  } else if (screen === 'allenatore') {
    loadAllenatoreData();
  } else if (screen === 'admin') {
    renderAdminTab();
  }
}

function showScreen(screenId) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById('screen-' + screenId).classList.add('active');
}

// ============ GOOGLE DRIVE FUNCTIONS ============
function syncGoogleDriveStructure() {
  // Crea cartella "Presenze" se non esiste
  console.log('🔄 Sincronizzazione struttura Google Drive...');
  // Per ora, solo logging - l'app scarica file pubblici
}

async function downloadFileFromGoogleDrive(fileId) {
  try {
    const url = `https://drive.google.com/uc?export=download&id=${fileId}`;
    const response = await fetch(url);
    if (!response.ok) throw new Error('Download fallito');
    return await response.arrayBuffer();
  } catch (err) {
    console.error('Errore download:', err);
    return null;
  }
}

// File ID diretti - non serve ricerca

// ============ GENITORE ============
function loadGenitoreData() {
  db.collection('users').doc(currentUser.uid).get().then(function(snap) {
    const userData = snap.data();
    
    // Parsa categorie da stringa (es. "cuccioli,giovani")
    const catsStr = userData.categoriesAsGenitore || '';
    const userCats = catsStr.split(',').map(c => c.trim()).filter(c => c && ALL_CATEGORIES.includes(c));
    
    // Chips
    let chipsHtml = '<button class="chip ' + (selectedGenitoreChip === 'all' ? 'active' : '') + '" onclick="selectGenitoreChip(\'all\')">Tutto</button>';
    userCats.forEach(cat => {
      chipsHtml += '<button class="chip ' + (selectedGenitoreChip === cat ? 'active' : '') + '" onclick="selectGenitoreChip(\'' + cat + '\')">' + CAT_LABELS[cat] + '</button>';
    });
    document.getElementById('genitore-chips').innerHTML = chipsHtml;
    
    // Carica e filtra eventi
    renderGenitoreCalendar(userCats);
  });
}

function selectGenitoreChip(cat) {
  selectedGenitoreChip = cat;
  document.querySelectorAll('#genitore-chips .chip').forEach((el, i) => {
    el.classList.remove('active');
  });
  event.target.classList.add('active');
  loadGenitoreData();
}

function renderGenitoreCalendar(userCats) {
  db.collection('events').orderBy('date').get().then(function(snap) {
    const events = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    
    const filtered = selectedGenitoreChip === 'all' 
      ? events.filter(e => userCats.includes(e.category))
      : events.filter(e => e.category === selectedGenitoreChip);
    
    let html = '';
    let currentMonth = '';
    
    filtered.forEach(e => {
      const d = new Date(e.date);
      const month = d.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });
      
      if (currentMonth !== month) {
        currentMonth = month;
        html += '<div class="month-label">' + month.charAt(0).toUpperCase() + month.slice(1) + '</div>';
      }
      
      const dayNum = d.getDate();
      const dayName = d.toLocaleDateString('it-IT', { weekday: 'short' });
      
      html += '<div class="event-card" onclick="openEventModal(this)" data-event-id="' + e.id + '" data-category="' + e.category + '">' +
        '<div class="event-date"><div class="event-day-num">' + dayNum + '</div><div class="event-day-name">' + dayName + '</div></div>' +
        '<div class="event-bar" style="background:' + (e.color || '#888') + '"></div>' +
        '<div class="event-info">' +
        '<div class="event-title">' + e.title + '</div>' +
        (e.details ? '<div class="event-sub">📌 ' + e.details + '</div>' : '') +
        '</div>' +
        '<div class="event-badge badge-info">' + CAT_LABELS[e.category] + '</div>' +
        '</div>';
    });
    
    if (filtered.length === 0) {
      html = '<div class="empty-state"><div class="empty-state-icon">📅</div>Nessun evento per questa categoria.</div>';
    }
    
    document.getElementById('genitore-content').innerHTML = html;
  });
}

// ============ ALLENATORE ============
function loadAllenatoreData() {
  db.collection('users').doc(currentUser.uid).get().then(function(snap) {
    const userData = snap.data();
    
    // Parsa categorie da stringa
    const catsStr = userData.categoriesAsAllenatore || '';
    const userCats = catsStr.split(',').map(c => c.trim()).filter(c => c && ALL_CATEGORIES.includes(c));
    
    // Chips
    let chipsHtml = '<button class="chip ' + (selectedAllenatoreChip === 'all' ? 'active' : '') + '" onclick="selectAllenatoreChip(\'all\')">Tutto</button>';
    userCats.forEach(cat => {
      chipsHtml += '<button class="chip ' + (selectedAllenatoreChip === cat ? 'active' : '') + '" onclick="selectAllenatoreChip(\'' + cat + '\')">' + CAT_LABELS[cat] + '</button>';
    });
    document.getElementById('allenatore-chips').innerHTML = chipsHtml;
    
    renderAllenatoreCalendar(userCats);
  });
}

function selectAllenatoreChip(cat) {
  selectedAllenatoreChip = cat;
  document.querySelectorAll('#allenatore-chips .chip').forEach(el => el.classList.remove('active'));
  event.target.classList.add('active');
  loadAllenatoreData();
}

function renderAllenatoreCalendar(userCats) {
  db.collection('events').orderBy('date').get().then(function(snap) {
    const events = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    
    const filtered = selectedAllenatoreChip === 'all'
      ? events.filter(e => userCats.includes(e.category))
      : events.filter(e => e.category === selectedAllenatoreChip);
    
    let html = '';
    let currentMonth = '';
    
    filtered.forEach(e => {
      const d = new Date(e.date);
      const month = d.toLocaleDateString('it-IT', { month: 'long', year: 'numeric' });
      
      if (currentMonth !== month) {
        currentMonth = month;
        html += '<div class="month-label">' + month.charAt(0).toUpperCase() + month.slice(1) + '</div>';
      }
      
      const dayNum = d.getDate();
      const dayName = d.toLocaleDateString('it-IT', { weekday: 'short' });
      
      html += '<div class="event-card" onclick="openEventModal(this)" data-event-id="' + e.id + '" data-category="' + e.category + '">' +
        '<div class="event-date"><div class="event-day-num">' + dayNum + '</div><div class="event-day-name">' + dayName + '</div></div>' +
        '<div class="event-bar" style="background:' + (e.color || '#888') + '"></div>' +

function saveAttendance(eventId, category, athleteCount) {
  const attendance = {};
  for (let i = 0; i < athleteCount; i++) {
    const checkbox = document.getElementById('presence-' + i);
    if (checkbox && checkbox.checked) {
      attendance[i] = true;
    }
  }
  
  db.collection('attendance').doc(eventId + '_' + category).set({
    eventId: eventId,
    category: category,
    attendance: attendance,
    recordedAt: firebase.firestore.FieldValue.serverTimestamp()
  }).then(() => {
    showPresenzeSuccess('✅ Presenze salvate!');
  }).catch(err => {
    showPresenzeError('Errore: ' + err.message);
  });
}

function exportPresenze(eventId, category, athleteCount) {
  db.collection('config/athletes').doc('athletes').get().then(function(snap) {
    if (!snap.exists) {
      showPresenzeError('Atleti non trovati.');
      return;
    }
    
    const athletes = snap.data().athletes[category] || [];
    const attendance = {};
    
    for (let i = 0; i < athleteCount; i++) {
      const checkbox = document.getElementById('presence-' + i);
      if (checkbox) attendance[i] = checkbox.checked;
    }
    
    // Genera CSV
    let csv = 'Evento,Data,Categoria,Atleta,Presente\n';
    
    db.collection('events').doc(eventId).get().then(function(eventSnap) {
      const event = eventSnap.data();
      
      athletes.forEach((athlete, idx) => {
        const isPresent = attendance[idx] === true ? 'Si' : 'No';
        const athleteName = athlete.surname + ' ' + athlete.name;
        csv += `"${event.title}","${event.date}","${CAT_LABELS[category]}","${athleteName}","${isPresent}"\n`;
      });
      
      // Salva su Google Drive (simulato per ora - vedi funzione uploadToGoogleDrive)
      uploadPresenceToGoogleDrive(eventId, category, csv);
      
      // Scarica localmente
      const blob = new Blob([csv], { type: 'text/csv' });
      const url = window.URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `Presenze_${event.date}_${category}.csv`;
      a.click();
      window.URL.revokeObjectURL(url);
    });
  });
}

async function syncAtletiFromDrive() {
  const statusEl = document.getElementById('sync-status');
  statusEl.innerHTML = '<div class="loading-msg"><div class="spinner"></div> Scaricando atleti da Google Drive...</div>';
  
  try {
    const arrayBuffer = await downloadFileFromGoogleDrive(ATLETI_FILE_ID);
    if (!arrayBuffer) throw new Error('Errore nel download del file');
    
    // Parsa XLSX
    const data = new Uint8Array(arrayBuffer);
    const workbook = XLSX.read(data, { type: 'array' });
    
    const athletes = {};
    ALL_CATEGORIES.forEach(cat => athletes[cat] = []);
    
    workbook.SheetNames.forEach(function(sheetName) {
      const sheet = workbook.Sheets[sheetName];
      const allRows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
      
      if (allRows.length < 3) return;
      
      const headerRow = allRows[1];
      const cognomeIdx = headerRow.indexOf('COGNOME');
      const nomeIdx = headerRow.indexOf('NOME');
      
      if (cognomeIdx < 0 || nomeIdx < 0) return;
      
      const category = sheetName.toLowerCase();
      if (!ALL_CATEGORIES.includes(category)) return;
      
      for (let i = 2; i < allRows.length; i++) {
        const row = allRows[i];
        const cognome = (row[cognomeIdx] || '').trim();
        const nome = (row[nomeIdx] || '').trim();
        
        if (cognome || nome) {
          athletes[category].push({
            name: nome,
            surname: cognome,
            category: category
          });
        }
      }
    });
    
    // Salva su Firestore
    await db.collection('config/athletes').doc('athletes').set({ athletes: athletes });
    const totalAthletes = Object.values(athletes).reduce((a, b) => a + b.length, 0);
    statusEl.innerHTML = '<div style="background:var(--teal-light);color:var(--teal);padding:10px;border-radius:var(--radius-sm);font-size:13px">✅ ' + totalAthletes + ' atleti sincronizzati da Google Drive!</div>';
  } catch (err) {
    statusEl.innerHTML = '<div style="background:var(--red-light);color:var(--red);padding:10px;border-radius:var(--radius-sm);font-size:13px">❌ Errore: ' + err.message + '</div>';
  }
}

async function syncProgrammaFromDrive() {
  const statusEl = document.getElementById('sync-status');
  statusEl.innerHTML = '<div class="loading-msg"><div class="spinner"></div> Scaricando programma da Google Drive...</div>';
  
  try {
    const arrayBuffer = await downloadFileFromGoogleDrive(PROGRAMMA_FILE_ID);
    if (!arrayBuffer) throw new Error('Errore nel download del file');
    
    const data = new Uint8Array(arrayBuffer);
    const workbook = XLSX.read(data, { type: 'array' });
    
    // Mappa colori a attività
    const colorActivityMap = {
      'FFC000': { activity: 'sci', title: 'SCI', color: '#FFC000' },           // Giallo
      '00B050': { activity: 'atletica', title: 'ATLETICA', color: '#00B050' },  // Verde
      '00B0F0': { activity: 'acrobatica', title: 'ACROBATICA', color: '#00B0F0' }, // Azzurro
      'FF7F00': { activity: 'multisport', title: 'MULTISPORT', color: '#FF7F00' } // Arancione
    };
    
    const events = [];
    let eventCounter = 0;
    
    // Leggi il primo sheet (dovrebbe contenere la griglia)
    const sheet = workbook.Sheets[workbook.SheetNames[0]];
    const allRows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
    
    // Riga 3 (indice 2) contiene i nomi delle categorie
    const categoryRow = allRows[2] || [];
    
    // Itera su colonne e righe per trovare celle con contenuto
    for (let colIdx = 0; colIdx < categoryRow.length; colIdx++) {
      const category = (categoryRow[colIdx] || '').toString().toLowerCase();
      if (!ALL_CATEGORIES.includes(category)) continue;
      
      // Per ogni categoria, leggi i giorni (righe successive)
      for (let rowIdx = 3; rowIdx < allRows.length; rowIdx++) {
        const row = allRows[rowIdx];
        const cellValue = row[colIdx] ? (row[colIdx] || '').toString().trim() : '';
        
        if (!cellValue) continue;
        
        // Tenta di estrarre il giorno dalla riga
        // Di solito è nella prima colonna dopo una colonna con il numero
        const dayCell = row[0] ? (row[0] || '').toString().trim() : '';
        const monthCell = row[1] ? (row[1] || '').toString().trim() : '';
        
        // Se non hai la data diretta, prova a ricavare da pattern
        // Per ora, registra l'attività trovata
        if (cellValue && cellValue !== '' && cellValue !== 'R') {
          // cellValue contiene il tipo di attività (SCI, ATLETICA, ACROBATICA, VIAGGIO, SNOWHALL, CERVINIA, CAMPUS)
          // Mappa il testo a colore/tipo
          let activity = cellValue.toLowerCase();
          let activityData = null;
          
          if (activity.includes('sci')) {
            activityData = { activity: 'sci', title: cellValue, color: '#FFC000' };
          } else if (activity.includes('atletica')) {
            activityData = { activity: 'atletica', title: cellValue, color: '#00B050' };
          } else if (activity.includes('acrobatica') || activity.includes('campus')) {
            activityData = { activity: 'acrobatica', title: cellValue, color: '#00B0F0' };
          } else if (activity.includes('viaggio') || activity.includes('snowhall') || activity.includes('cervinia')) {
            // Questi potrebbero essere sottotipo di sci
            activityData = { activity: 'sci', title: cellValue, color: '#FFC000' };
          } else {
            activityData = { activity: 'altro', title: cellValue, color: '#999999' };
          }
          
          eventCounter++;
        }
      }
    }
    
    // Nota: il parsing completo della griglia richiede logica più sofisticata
    // per mappare riga→giorno e colonna→categoria. Per ora, mostra un'anteprima.
    statusEl.innerHTML = '<div style="background:var(--blue-light);color:var(--blue-dark);padding:10px;border-radius:var(--radius-sm);font-size:13px">📊 Programma scaricato (analizzato ' + eventCounter + ' celle). Parser in progress - contattami per mapping completo data/categoria!</div>';
    
  } catch (err) {
    statusEl.innerHTML = '<div style="background:var(--red-light);color:var(--red);padding:10px;border-radius:var(--radius-sm);font-size:13px">❌ Errore: ' + err.message + '</div>';
  }
}

      });
    } catch (err) {
      document.getElementById('import-status').innerHTML = '<div style="background:var(--red-light);color:var(--red);padding:10px;border-radius:var(--radius-sm);font-size:13px">❌ Errore: ' + err.message + '</div>';
    }
  };
  reader.readAsArrayBuffer(file);
}

function renderUtentiTab() {
  document.getElementById('admin-content').innerHTML = '<div class="admin-section"><div class="admin-card"><div class="admin-card-title">👤 Utenti</div><div id="users-list" style="font-size:13px;color:var(--text-sec)">Caricamento...</div></div></div>';
  
  db.collection('users').get().then(function(snap) {
    const users = snap.docs.map(d => Object.assign({ id: d.id }, d.data()))
      .sort((a, b) => (a.displayName || '').localeCompare(b.displayName || ''));
    
    const approved = users.filter(u => u.status === 'approved');
    const pending = users.filter(u => u.status === 'pending');
    const rejected = users.filter(u => u.status === 'rejected');
    
    let html = '';
    
    if (approved.length > 0) {
      html += '<div class="admin-card"><div class="admin-card-title" style="margin-top:0">✅ Approvati (' + approved.length + ')</div>';
      approved.forEach(u => {
        const role = u.role === 'admin' ? 'Admin' : u.role === 'allenatore' ? 'Allenatore' : 'Genitore';
        html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:.5px solid var(--border)">' +
          '<div>' +
          '<div style="font-size:14px;font-weight:500">' + (u.displayName || u.email) + '</div>' +
          '<div style="font-size:12px;color:var(--text-sec)">' + role + '</div>' +
          '</div>' +
          (u.role !== 'admin' ? '<button class="btn-sm" style="background:var(--red-light);color:var(--red)" onclick="suspendUser(\'' + u.id + '\')">Sospendi</button>' : '') +
          '</div>';
      });
      html += '</div>';
    }
    
    if (pending.length > 0) {
      html += '<div class="admin-card"><div class="admin-card-title">⏳ In sospeso (' + pending.length + ')</div>';
      pending.forEach(u => {
        html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:.5px solid var(--border)">' +
          '<div>' +
          '<div style="font-size:14px;font-weight:500">' + (u.displayName || u.email) + '</div>' +
          '<div style="font-size:12px;color:var(--text-sec)">' + u.email + '</div>' +
          '</div>' +
          '<button class="btn-sm" style="background:var(--teal-light);color:var(--teal)" onclick="approveUser(\'' + u.id + '\')">Approva</button>' +
          '</div>';
      });
      html += '</div>';
    }
    
    if (rejected.length > 0) {
      html += '<div class="admin-card"><div class="admin-card-title">❌ Rifiutati (' + rejected.length + ')</div>';
      rejected.forEach(u => {
        html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:.5px solid var(--border)">' +
          '<div style="font-size:14px;font-weight:500">' + (u.displayName || u.email) + '</div>' +
          '<button class="btn-sm" style="background:var(--teal-light);color:var(--teal)" onclick="approveUser(\'' + u.id + '\')">Riattiva</button>' +
          '</div>';
      });
      html += '</div>';
    }
    
    document.getElementById('users-list').innerHTML = html || '<div style="padding:20px;text-align:center;color:var(--text-sec)">Nessun utente trovato</div>';
  });
}

function approveUser(uid) {
  db.collection('users').doc(uid).update({ status: 'approved' }).then(() => {
    renderUtentiTab();
  });
}

function suspendUser(uid) {
  if (confirm('Sospendere questo account?')) {
    db.collection('users').doc(uid).update({ status: 'rejected' }).then(() => {
      renderUtentiTab();
    });
  }
}

function renderMediciTab() {
  let html = '<div class="admin-section"><div class="admin-card">' +
    '<div class="admin-card-title">🏥 Certificati medici</div>' +
    '<div style="font-size:13px;color:var(--text-sec);margin-bottom:12px">Gestisci scadenze dei certificati medici per categoria.</div>';
  
  db.collection('config/athletes').doc('athletes').get().then(function(snap) {
    if (!snap.exists) {
      html += '<div style="padding:20px;text-align:center;color:var(--text-sec)">Importa atleti per visualizzare certificati medici</div>';
      document.getElementById('admin-content').innerHTML = html + '</div></div>';
      return;
    }
    
    const athletes = snap.data().athletes || {};
    
    for (const [cat, list] of Object.entries(athletes)) {
      const scaduti = list.filter(a => {
        if (!a.medicalExpiry) return false;
        const exp = new Date(a.medicalExpiry);
        return exp < new Date();
      }).length;
      
      const inScadenza = list.filter(a => {
        if (!a.medicalExpiry) return false;
        const exp = new Date(a.medicalExpiry);
        const diff = Math.ceil((exp - new Date()) / (1000 * 60 * 60 * 24));
        return diff >= 0 && diff < 30;
      }).length;
      
      html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:.5px solid var(--border)">' +
        '<div>' +
        '<div style="font-size:14px;font-weight:500">' + CAT_LABELS[cat] + '</div>' +
        '<div style="font-size:12px;color:var(--text-sec)">🔴 Scaduti: ' + scaduti + ' | 🟡 In scadenza: ' + inScadenza + '</div>' +
        '</div>' +
        '<button class="btn-sm" style="background:var(--teal-light);color:var(--teal)" onclick="openMediciModal(\'' + cat + '\')">Dettagli</button>' +
        '</div>';
    }
    
    document.getElementById('admin-content').innerHTML = html + '</div></div>';
  });
}

function openMediciModal(cat) {
  db.collection('config/athletes').doc('athletes').get().then(function(snap) {
    if (!snap.exists) return;
    
    const athletes = snap.data().athletes[cat] || [];
    let html = '<div style="margin-bottom:16px"><div style="font-size:16px;font-weight:600">' + CAT_LABELS[cat] + ' - Certificati medici</div></div>';
    
    const byStatus = { scaduti: [], inScadenza: [], validi: [], nonInseriti: [] };
    
    athletes.forEach(a => {
      if (!a.medicalExpiry) {
        byStatus.nonInseriti.push(a);
      } else {
        const exp = new Date(a.medicalExpiry);
        const diff = Math.ceil((exp - new Date()) / (1000 * 60 * 60 * 24));
        if (diff < 0) byStatus.scaduti.push(a);
        else if (diff < 30) byStatus.inScadenza.push(a);
        else byStatus.validi.push(a);
      }
    });
    
    const sections = [
      { title: '🔴 Scaduti', data: byStatus.scaduti, color: 'var(--red)' },
      { title: '🟡 In scadenza', data: byStatus.inScadenza, color: 'var(--amber-mid)' },
      { title: '🟢 Validi', data: byStatus.validi, color: 'var(--teal)' },
      { title: '⚪ Non inseriti', data: byStatus.nonInseriti, color: 'var(--gray-400)' }
    ];
    
    sections.forEach(sec => {
      if (sec.data.length > 0) {
        html += '<div style="margin-top:16px"><div style="font-size:13px;font-weight:600;color:' + sec.color + ';">' + sec.title + ' (' + sec.data.length + ')</div>';
        sec.data.forEach(a => {
          html += '<div style="padding:8px 0;border-bottom:.5px solid var(--border);font-size:13px">' +
            '<div style="font-weight:500">' + a.surname + ' ' + a.name + '</div>' +
            '<div style="color:var(--text-sec);font-size:12px">' + (a.medicalExpiry ? new Date(a.medicalExpiry).toLocaleDateString('it-IT') : 'N/A') + '</div>' +
            '</div>';
        });
        html += '</div>';
      }
    });
    
    document.getElementById('event-modal-content').innerHTML = html;
    document.getElementById('event-modal').classList.add('active');
  });
}

function renderEventsTab() {
  document.getElementById('admin-content').innerHTML = '<div class="admin-section"><div class="admin-card"><div class="admin-card-title">📌 Gestione eventi</div><div id="events-list" style="font-size:13px;color:var(--text-sec)">Caricamento...</div></div></div>';
  
  db.collection('events').orderBy('date').get().then(function(snap) {
    const events = snap.docs.map(d => Object.assign({ id: d.id }, d.data()));
    
    let html = '';
    events.forEach(e => {
      html += '<div style="display:flex;align-items:center;justify-content:space-between;padding:12px 0;border-bottom:.5px solid var(--border)">' +
        '<div>' +
        '<div style="font-size:14px;font-weight:500">' + e.title + '</div>' +
        '<div style="font-size:12px;color:var(--text-sec)">' + new Date(e.date).toLocaleDateString('it-IT') + ' - ' + CAT_LABELS[e.category] + '</div>' +
        '</div>' +
        '<button class="btn-sm" style="background:var(--red-light);color:var(--red)" onclick="deleteEvent(\'' + e.id + '\')">Elimina</button>' +
        '</div>';
    });
    
    html += '<div style="margin-top:16px"><button class="btn-primary" style="background:var(--teal)">+ Nuovo evento</button></div>';
    
    document.getElementById('events-list').innerHTML = html || '<div style="padding:20px;text-align:center;color:var(--text-sec)">Nessun evento trovato</div>';
  });
}

function deleteEvent(eventId) {
  if (confirm('Eliminare questo evento?')) {
    db.collection('events').doc(eventId).delete().then(() => {
      renderEventsTab();
    });
  }
}
