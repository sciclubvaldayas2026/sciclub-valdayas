<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sci Club Val d'Ayas v4.29</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-compat.js"></script>
  <style>
    :root {
      --bg: #f8f8f8;
      --bg-card: #ffffff;
      --text: #1a1a1a;
      --text-sec: #666666;
      --border: #e0e0e0;
      --blue-dark: #003d82;
      --blue-mid: #0066cc;
      --blue-light: #e8f1ff;
      --gray-50: #f5f5f5;
      --red: #dc2626;
      --green: #16a34a;
    }
    
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.6;
    }
    
    #app {
      max-width: 1000px;
      margin: 0 auto;
      padding: 20px;
      min-height: 100vh;
    }
    
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    
    .header-logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    
    .header-logo img {
      height: 40px;
      width: auto;
    }
    
    .header-title {
      font-size: 20px;
      font-weight: 600;
      color: var(--blue-dark);
    }
    
    h1, h2, h3 { margin: 20px 0 10px 0; }
    h1 { font-size: 24px; }
    h2 { font-size: 18px; color: var(--text); }
    h3 { font-size: 14px; color: var(--text-sec); font-weight: 500; }
    
    .btn-primary {
      background: var(--blue-dark);
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .btn-primary:hover { background: #002a5c; }
    
    .btn-secondary {
      background: var(--bg-card);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .btn-secondary:hover { background: var(--gray-50); }
    
    .btn-danger {
      background: var(--red);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    
    .btn-success {
      background: var(--green);
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 12px;
      cursor: pointer;
    }
    
    input[type="text"], input[type="email"], input[type="password"], textarea, select {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      font-family: inherit;
      margin-bottom: 12px;
    }
    
    .form-group {
      margin-bottom: 16px;
    }
    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: var(--text);
    }
    
    .spinner {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid var(--border);
      border-top-color: var(--blue-dark);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    .chip {
      background: var(--bg-card);
      color: var(--text-sec);
      border: 1px solid var(--border);
      padding: 8px 16px;
      border-radius: 20px;
      font-size: 13px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .chip:hover { background: var(--gray-50); }
    
    .role-menu {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 24px;
    }
    .role-btn {
      padding: 16px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: var(--bg-card);
      cursor: pointer;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s;
      text-align: left;
    }
    .role-btn:hover { border-color: var(--blue-mid); }
    
    .admin-menu {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 12px;
      margin-bottom: 24px;
    }
    .admin-card {
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
      text-align: center;
    }
    .admin-card:hover { border-color: var(--blue-mid); background: var(--blue-light); }
    .admin-card-title { font-weight: 600; margin-bottom: 4px; }
    .admin-card-count { font-size: 24px; font-weight: 700; color: var(--blue-dark); }
    
    .user-item {
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    
    .user-info {
      flex: 1;
    }
    .user-name { font-weight: 600; }
    .user-meta { font-size: 12px; color: var(--text-sec); margin-top: 4px; }
    
    .user-actions {
      display: flex;
      gap: 8px;
    }
    
    .badge {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 11px;
      font-weight: 600;
    }
    .badge-pending { background: #fef08a; color: #92400e; }
    .badge-approved { background: #bbf7d0; color: #065f46; }
    
    .card {
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 12px;
    }
    
    .activity-item {
      background: var(--bg-card);
      border: 0.5px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .activity-item:hover { background: var(--blue-light); border-color: var(--blue-mid); }
    
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(0,0,0,0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    
    .modal {
      background: var(--bg-card);
      border-radius: 12px;
      padding: 24px;
      max-width: 500px;
      width: 90%;
      max-height: 90vh;
      overflow-y: auto;
    }
    
    .modal-header {
      font-size: 18px;
      font-weight: 600;
      margin-bottom: 20px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }
    
    .modal-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 32px;
      height: 32px;
      border: none;
      background: var(--gray-50);
      border-radius: 6px;
      cursor: pointer;
      font-size: 18px;
    }
    
    .divider {
      text-align: center;
      margin: 24px 0;
      position: relative;
    }
    .divider::before {
      content: '';
      position: absolute;
      top: 50%;
      left: 0;
      right: 0;
      height: 1px;
      background: var(--border);
    }
    .divider span {
      background: var(--bg);
      padding: 0 12px;
      position: relative;
      color: var(--text-sec);
      font-size: 13px;
    }
    
    .btn-link {
      background: none;
      border: none;
      color: var(--blue-mid);
      cursor: pointer;
      text-decoration: underline;
      font-size: 14px;
      padding: 0;
    }
    
    .atleti-list {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
      margin-bottom: 12px;
    }
    
    .atleta-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px;
      border-bottom: 1px solid var(--border);
    }
    
    .atleta-item:last-child {
      border-bottom: none;
    }
    
    .btn-add {
      background: var(--blue-light);
      color: var(--blue-dark);
      border: 1px dashed var(--blue-dark);
      padding: 10px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
      width: 100%;
    }
    
    .btn-add:hover {
      background: var(--blue-dark);
      color: white;
    }
    
    .btn-remove {
      background: #fee2e2;
      color: var(--red);
      border: none;
      padding: 4px 8px;
      border-radius: 4px;
      font-size: 12px;
      cursor: pointer;
    }
  </style>
</head>

    // ============ HEADER CON LOGO ============
    function renderHeader() {
      return '<div class="header">' +
        '<div class="header-logo">' +
        '<img src="' + LOGO_BASE64 + '" alt="Sci Club Val d\'Ayas">' +
        '<span class="header-title">Sci Club Val d\'Ayas</span>' +
        '</div>' +
        '</div>';
    }

    // ============ LOGIN & REGISTRATION ============
    function showLogin() {
      var html = renderHeader();
      html += '<div style="max-width:400px;margin:60px auto">';
      html += '<div class="form-group">';
      html += '<label class="form-label">Email</label>';
      html += '<input type="email" id="login-email" placeholder="tua@email.com">';
      html += '</div>';
      html += '<div class="form-group">';
      html += '<label class="form-label">Password</label>';
      html += '<input type="password" id="login-password" placeholder="•••••••">';
      html += '</div>';
      html += '<button class="btn-primary" onclick="login()" style="width:100%">Login</button>';
      html += '<div class="divider"><span>oppure</span></div>';
      html += '<button class="btn-secondary" onclick="showRegistration()" style="width:100%">Registrati</button>';
      html += '</div>';
      document.getElementById('app').innerHTML = html;
    }

    function showRegistration() {
      tempAtletiRegistrazione = [];
      var html = renderHeader();
      html += '<div style="max-width:450px;margin:40px auto">';
      html += '<h2 style="text-align:center;margin-bottom:24px">Registrazione</h2>';
      html += '<div class="form-group">';
      html += '<label class="form-label">Nome</label>';
      html += '<input type="text" id="reg-nome" placeholder="Nome">';
      html += '</div>';
      html += '<div class="form-group">';
      html += '<label class="form-label">Cognome</label>';
      html += '<input type="text" id="reg-cognome" placeholder="Cognome">';
      html += '</div>';
      html += '<div class="form-group">';
      html += '<label class="form-label">Email</label>';
      html += '<input type="email" id="reg-email" placeholder="tua@email.com">';
      html += '</div>';
      html += '<div class="form-group">';
      html += '<label class="form-label">Password</label>';
      html += '<input type="password" id="reg-password" placeholder="Almeno 6 caratteri">';
      html += '</div>';
      html += '<div class="form-group">';
      html += '<label class="form-label">Sei un allenatore?</label>';
      html += '<div style="margin-top:8px;color:var(--text-sec);font-size:12px">⚠️ Gli allenatori devono essere registrati dall\'admin</div>';
      html += '</div>';
      
      html += '<h3 style="margin-top:20px;margin-bottom:12px">I tuoi atleti</h3>';
      html += '<div id="atleti-list-reg" class="atleti-list">';
      if (tempAtletiRegistrazione.length === 0) {
        html += '<div style="color:var(--text-sec);font-size:13px;text-align:center;padding:12px">Nessun atleta aggiunto</div>';
      } else {
        tempAtletiRegistrazione.forEach(function(atleta, idx) {
          html += '<div class="atleta-item">';
          html += '<div>';
          html += '<strong>' + atleta.nome + ' ' + atleta.cognome + '</strong>';
          html += '<div style="font-size:12px;color:var(--text-sec)">' + (CAT_LABELS[atleta.categoria] || atleta.categoria) + '</div>';
          html += '</div>';
          html += '<button class="btn-remove" onclick="removeAtletaReg(' + idx + ')">Rimuovi</button>';
          html += '</div>';
        });
      }
      html += '</div>';
      html += '<button class="btn-add" onclick="showAddAtleta()">+ Aggiungi Atleta</button>';
      
      html += '<div style="display:flex;gap:12px;margin-top:24px">';
      html += '<button class="btn-secondary" onclick="showLogin()" style="flex:1">← Torna al login</button>';
      html += '<button class="btn-primary" onclick="register()" style="flex:1">Registrati</button>';
      html += '</div>';
      html += '</div>';
      document.getElementById('app').innerHTML = html;
    }

        alert('Compila email e password');
        return;
      }

        .then(function(result) {
          currentUser = result.user;
          loadUserData();

    function register() {
      var nome = document.getElementById('reg-nome').value.trim();
      var cognome = document.getElementById('reg-cognome').value.trim();
      var email = document.getElementById('reg-email').value.trim();
      var password = document.getElementById('reg-password').value;
      
      if (!nome || !cognome || !email || !password) {
        alert('Compila tutti i campi');
        return;
      }
      
      if (password.length < 6) {
        alert('Password deve avere almeno 6 caratteri');
        return;
      }
      
      auth.createUserWithEmailAndPassword(email, password)
        .then(function(result) {
          var uid = result.user.uid;

            uid: uid,
            email: email,
            role: 'atleta',
            status: 'pending_approval',
            profileData: { nome: nome, cognome: cognome },
            atleti: tempAtletiRegistrazione,
            allenatore_categories: [],
            createdAt: firebase.firestore.Timestamp.now()
          };
          
          console.log('📝 Salvataggio in Firestore:', userData);
          return db.collection('users').doc(uid).set(userData);
        })
        .then(function() {
          console.log('✅ Registrazione completata!');
          alert('Registrazione completata! L\'admin deve approvare il tuo account.');
          tempAtletiRegistrazione = [];
          showLogin();
        })

          alert('Errore registrazione: ' + error.message + '\n\nDettagli: ' + error.code);

    function loadUserData() {
      if (!currentUser) return;
      
      db.collection('users').doc(currentUser.uid).get()
        .then(function(doc) {
          if (doc.exists) {
            currentUserData = Object.assign({ uid: currentUser.uid }, doc.data());
            
            // FIX v4.25: Check se account è in approvazione
            if (currentUserData.status === 'pending_approval') {
              alert('Il tuo account è in attesa di approvazione dall\'admin. Ti contatterà presto!');
              logout();
              return;
            }
            
            // FIX v4.25: Check se status è approvato
            if (currentUserData.status !== 'approved') {
              alert('Il tuo account è stato rifiutato.');
              logout();
              return;
            }
            
            var isAtleta = currentUserData.role === 'atleta';
            var isAllenatore = currentUserData.role === 'allenatore';
            var isAdmin = currentUserData.role === 'admin';
            
            if (isAdmin) {
              loadAdminStats();
              showAdminDashboard();
            } else if (isAtleta && !isAllenatore) {
              currentRole = 'atleta';
              showAtletaDashboard();
            } else if (isAllenatore && !isAtleta) {
              currentRole = 'allenatore';
              showAllenatoreDashboard();
            } else if (isAtleta && isAllenatore) {
              showRoleMenu();
            } else {
              alert('Profilo non valido');
              logout();
            }
          } else {
            alert('Profilo non trovato');
          }
        })
        .catch(function(err) {
          alert('Errore caricamento profilo: ' + err.message);
        });
    }

    // ============ ATLETA DASHBOARD ============
    function loadAttivitaPerCategoria(categoria, callback) {
      downloadFileFromGoogleDrive(PROGRAMMA_FILE_ID).then(function(arrayBuffer) {
        var data = new Uint8Array(arrayBuffer);
        var workbook = XLSX.read(data, { type: 'array' });
        var sheet = workbook.Sheets[workbook.SheetNames[0]];
        var allRows = XLSX.utils.sheet_to_json(sheet, { header: 1, defval: '' });
        
        var monthRow = allRows[0] || [];
        var categoryRow = allRows[2] || [];
        
        var months = [];
        var currentMonth = null;
        for (var colIdx = 0; colIdx < monthRow.length; colIdx++) {
          var monthCell = (monthRow[colIdx] || '').toString().trim().toUpperCase();
          if (monthCell && ['GENNAIO', 'FEBBRAIO', 'MARZO', 'APRILE', 'MAGGIO', 'GIUGNO', 'LUGLIO', 'AGOSTO', 'SETTEMBRE', 'OTTOBRE', 'NOVEMBRE', 'DICEMBRE'].includes(monthCell)) {
            if (currentMonth) {
              currentMonth.endCol = colIdx - 1;
              months.push(currentMonth);
            }
            currentMonth = { name: monthCell, startCol: colIdx, endCol: colIdx };
          }
        }
        if (currentMonth) {
          currentMonth.endCol = monthRow.length - 1;
          months.push(currentMonth);
        }
        
        if (!calendarioAttivita[categoria]) {
          calendarioAttivita[categoria] = {};
        }
        
        months.forEach(function(monthData) {
          var monthName = monthData.name.toLowerCase();
          var monthNum = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'].indexOf(monthName) + 1;
          var year = 2026;
          
          var monthCategories = [];
          for (var colIdx = monthData.startCol; colIdx <= monthData.endCol; colIdx++) {
            var catCell = (categoryRow[colIdx] || '').toString().trim().toUpperCase();
            if (catCell && ALL_CATEGORIES.includes(catCell.toLowerCase())) {
              monthCategories.push({ col: colIdx, name: catCell.toLowerCase() });
            }
          }
          
          for (var rowIdx = 10; rowIdx <= 40 && rowIdx < allRows.length; rowIdx++) {
            var row = allRows[rowIdx] || [];
            var dayNumCell = (row[monthData.startCol] || '').toString().trim();
            var dayNum = parseInt(dayNumCell);
            if (isNaN(dayNum) || dayNum < 1 || dayNum > 31) continue;
            
            var dateStr = String(year) + '-' + String(monthNum).padStart(2, '0') + '-' + String(dayNum).padStart(2, '0');
            
            monthCategories.forEach(function(catInfo) {
              var activityCell = (row[catInfo.col] || '').toString().trim();
              
              if (activityCell && activityCell.length > 0 && activityCell !== 'R' && catInfo.name === categoria) {
                var activityType = 'sci';
                var color = '#FFC000';
                
                var cellUpper = activityCell.toUpperCase();
                if (cellUpper.includes('ATLETICA')) {
                  activityType = 'atletica';
                  color = '#00B050';
                } else if (cellUpper.includes('ACROBATICA') || cellUpper.includes('CAMPUS')) {
                  activityType = 'acrobatica';
                  color = '#00B0F0';
                } else if (cellUpper.includes('MULTISPORT')) {
                  activityType = 'multisport';
                  color = '#FF7F00';
                }
                
                if (!calendarioAttivita[categoria][dateStr]) {
                  calendarioAttivita[categoria][dateStr] = [];
                }
                
                var alreadyExists = calendarioAttivita[categoria][dateStr].some(function(existing) {
                  return existing.title === activityCell && existing.type === activityType;
                });
                
                if (!alreadyExists) {
                  calendarioAttivita[categoria][dateStr].push({
                    date: dateStr,
                    title: activityCell,
                    type: activityType,
                    color: color
                  });
                }
              }
            });
          }
        });
        
        if (callback) callback();
      }).catch(function(err) {
        console.error('Errore caricamento attività:', err);
        if (callback) callback();
      });
    }

    function loadMessaggiPerCategoria(categoria, callback) {

    // ============ RAGGRUPPAMENTO EVENTI (v4.14) ============
    function groupEventsByTrasferta(dates) {
      if (dates.length === 0) return [];
      
      var groups = [];
      var currentGroup = [dates[0]];
      
      for (var i = 1; i < dates.length; i++) {
        var prevDate = new Date(dates[i - 1] + 'T00:00:00');
        var currDate = new Date(dates[i] + 'T00:00:00');
        var diffMs = currDate - prevDate;
        var diffDays = diffMs / (1000 * 60 * 60 * 24);
        
        if (diffDays === 1) {
          currentGroup.push(dates[i]);
        } else {
          groups.push(currentGroup);
          currentGroup = [dates[i]];
        }
      }
      groups.push(currentGroup);
      
      return groups;
    }

    function getTrasfertaHeader(dateGroup) {
      if (dateGroup.length === 1) {
        return null;
      }
      
      var startDate = new Date(dateGroup[0] + 'T00:00:00');
      var endDate = new Date(dateGroup[dateGroup.length - 1] + 'T00:00:00');
      
      var mesiNomi = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
      var startDay = startDate.getDate();
      var endDay = endDate.getDate();
      var startMonth = mesiNomi[startDate.getMonth()];
      var endMonth = mesiNomi[endDate.getMonth()];
      
      if (startMonth === endMonth) {
        return '🚌 Trasferta ' + startDay + '-' + endDay + ' ' + startMonth;
      } else {
        return '🚌 Trasferta ' + startDay + ' ' + startMonth + ' - ' + endDay + ' ' + endMonth;
      }
    }

    function renderListaAttivita(categoria) {
      var attivita = calendarioAttivita[categoria] || {};
      var messaggi = calendarioMessaggi[categoria] || {};
      
      var allDates = {};
      Object.keys(attivita).forEach(function(dateStr) {
        if (!allDates[dateStr]) allDates[dateStr] = { attivita: [], messaggi: [] };
        allDates[dateStr].attivita = attivita[dateStr];
      });
      Object.keys(messaggi).forEach(function(dateStr) {
        if (!allDates[dateStr]) allDates[dateStr] = { attivita: [], messaggi: [] };
        allDates[dateStr].messaggi = messaggi[dateStr];
      });
      
      var sortedDates = Object.keys(allDates).sort();
      
      if (sortedDates.length === 0) {
        return '<div style="padding:40px 20px;text-align:center;color:var(--text-sec)">Nessuna attività per questa categoria</div>';
      }
      
      // RAGGRUPPAMENTO TRASFERTE (v4.14)
      var dateGroups = groupEventsByTrasferta(sortedDates);
      
      var html = '<div style="padding:12px">';
      
      dateGroups.forEach(function(dateGroup) {
        var trasfertaHeader = getTrasfertaHeader(dateGroup);
        
        // Se è una trasferta, mostra intestazione
        if (trasfertaHeader) {
          html += '<div style="margin-top:24px;margin-bottom:12px;padding:12px;background:linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);border-radius:8px;color:white;font-weight:600;font-size:14px">';
          html += trasfertaHeader;
          html += '</div>';
        }
        
        // Render tutti i giorni nel gruppo
        dateGroup.forEach(function(dateStr, dayIdx) {
          var d = new Date(dateStr + 'T00:00:00');
          var giorniNomi = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
          var dayName = giorniNomi[d.getDay()];
          var dayNum = d.getDate();
          var monthNum = d.getMonth() + 1;
          var mesiNomi = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
          var monthName = mesiNomi[d.getMonth()];
          
          var items = allDates[dateStr];
          
          // Meno margin se è parte di una trasferta
          var marginTop = trasfertaHeader ? (dayIdx === 0 ? '8px' : '0px') : '12px';
          var marginBottom = trasfertaHeader ? '0px' : '16px';
          
          html += '<div style="margin-bottom:' + marginBottom + ';margin-top:' + marginTop + '">';
          
          // ATTIVITÀ (CONDENSA DATA + NOME NELLA STESSA RIGA - v4.20)
          if (items.attivita && items.attivita.length > 0) {
            items.attivita.forEach(function(act, idx) {
              html += '<div style="background:var(--bg-card);border-radius:8px;border:0.5px solid var(--border);overflow:hidden;margin-bottom:0px">';
              
              // DATA + NOME ATTIVITÀ STESSA RIGA
              html += '<div style="padding:10px 12px;border-left:3px solid ' + act.color + ';display:flex;justify-content:space-between;align-items:center">';
              html += '<div style="font-weight:600;font-size:13px;color:var(--text);text-transform:capitalize">' + dayName + ', ' + dayNum + ' ' + monthName + ' - ' + act.title + '</div>';
              html += '</div>';
              
              // TIPO ATTIVITÀ SOTTO
              html += '<div style="padding:0 12px 10px 12px;border-left:3px solid ' + act.color + ';margin-left:-3px">';
              html += '<div style="font-size:11px;color:var(--text-sec)">' + (act.type === 'sci' ? '⛷️ Sci' : act.type === 'atletica' ? '🏃 Atletica' : act.type === 'acrobatica' ? '🤸 Acrobatica' : '🏋️ Multisport') + '</div>';
              html += '</div>';
              
              html += '</div>';
            });
          }
          
          // MESSAGGI
          if (items.messaggi && items.messaggi.length > 0) {
            items.messaggi.forEach(function(msg) {
              html += '<div style="background:var(--bg-card);border-radius:8px;border:0.5px solid var(--border);overflow:hidden;margin-bottom:0px">';
              
              // DATA + AUTORE STESSA RIGA
              html += '<div style="padding:10px 12px;border-left:3px solid var(--blue-mid);display:flex;justify-content:space-between;align-items:center">';
              html += '<div style="font-weight:600;font-size:13px;color:var(--text);text-transform:capitalize">' + dayName + ', ' + dayNum + ' ' + monthName + ' - 💬 ' + (msg.authorName || 'Allenatore') + '</div>';
              html += '</div>';
              
              // TESTO MESSAGGIO
              html += '<div style="padding:0 12px 10px 12px;color:var(--text);line-height:1.4;font-size:12px">';
              html += (msg.text || msg.messaggio || '');
              
              if (msg.id && (currentRole === 'allenatore' || currentUserData.role === 'allenatore')) {
                html += '<div style="margin-top:8px;display:flex;gap:6px">';
                html += '<button class="btn-remove" onclick="editMessage(\'' + msg.id + '\', \'' + categoria + '\', \'' + (msg.text || '').replace(/'/g, "\\'") + '\')">✏️ Modifica</button>';
                html += '<button class="btn-remove" onclick="deleteMessage(\'' + msg.id + '\', \'' + categoria + '\')">🗑️ Cancella</button>';
                html += '</div>';
              }
              html += '</div>';
              
              html += '</div>';
            });
          }
          
          html += '</div>';
        });
      });
      
      html += '</div>';
      return html;
    }

    function renderAllenatoreLista(categoria) {
      var attivita = calendarioAttivita[categoria] || {};
      var messaggi = calendarioMessaggi[categoria] || {};
      
      var allDates = {};
      Object.keys(attivita).forEach(function(dateStr) {
        if (!allDates[dateStr]) allDates[dateStr] = { attivita: [], messaggi: [] };
        allDates[dateStr].attivita = attivita[dateStr];
      });
      Object.keys(messaggi).forEach(function(dateStr) {
        if (!allDates[dateStr]) allDates[dateStr] = { attivita: [], messaggi: [] };
        allDates[dateStr].messaggi = messaggi[dateStr];
      });
      
      var sortedDates = Object.keys(allDates).sort();
      
      // RAGGRUPPAMENTO TRASFERTE (v4.18)
      var dateGroups = groupEventsByTrasferta(sortedDates);
      
      var html = '<div style="padding:12px">';
      
      if (sortedDates.length === 0) {
        html += '<div style="text-align:center;color:var(--text-sec);padding:20px">Nessuna attività</div>';
      } else {
        dateGroups.forEach(function(dateGroup) {
          var trasfertaHeader = getTrasfertaHeader(dateGroup);
          
          // Se è una trasferta, mostra intestazione
          if (trasfertaHeader) {
            html += '<div style="margin-top:24px;margin-bottom:12px;padding:12px;background:linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);border-radius:8px;color:white;font-weight:600;font-size:14px">';
            html += trasfertaHeader;
            html += '</div>';
          }
          
          // Render tutti i giorni nel gruppo
          dateGroup.forEach(function(dateStr, dayIdx) {
            var d = new Date(dateStr + 'T00:00:00');
            var giorniNomi = ['domenica', 'lunedì', 'martedì', 'mercoledì', 'giovedì', 'venerdì', 'sabato'];
            var dayName = giorniNomi[d.getDay()];
            var dayNum = d.getDate();
            var monthNum = d.getMonth() + 1;
            var mesiNomi = ['gen', 'feb', 'mar', 'apr', 'mag', 'giu', 'lug', 'ago', 'set', 'ott', 'nov', 'dic'];
            var monthName = mesiNomi[d.getMonth()];
            
            var items = allDates[dateStr];
            
            // Meno margin se è parte di una trasferta
            var marginTop = trasfertaHeader ? (dayIdx === 0 ? '8px' : '0px') : '12px';
            var marginBottom = trasfertaHeader ? '0px' : '16px';
            
            html += '<div style="margin-bottom:' + marginBottom + ';margin-top:' + marginTop + '">';
            
            // ATTIVITÀ (CONDENSA DATA + NOME NELLA STESSA RIGA - v4.20)
            if (items.attivita && items.attivita.length > 0) {
              items.attivita.forEach(function(act, idx) {
                html += '<div style="background:var(--bg-card);border-radius:8px;border:0.5px solid var(--border);overflow:hidden;margin-bottom:0px">';
                
                // DATA + NOME ATTIVITÀ STESSA RIGA (CLICKABILE)
                html += '<div class="activity-item" onclick="openMessageForm(\'' + dateStr + '\', \'' + act.title.replace(/'/g, "\\'") + '\', \'' + categoria + '\')" style="border-left:3px solid ' + act.color + ';cursor:pointer;padding:10px 12px;display:flex;justify-content:space-between;align-items:center">';
                html += '<div style="font-weight:600;font-size:13px;color:var(--text);text-transform:capitalize">' + dayName + ', ' + dayNum + ' ' + monthName + ' - ' + act.title + '</div>';
                html += '<div style="font-size:11px;color:var(--text-sec)">Clicca per aggiungere messaggio</div>';
                html += '</div>';
                
                html += '</div>';
              });
            }
            
            // MESSAGGI
            if (items.messaggi && items.messaggi.length > 0) {
              items.messaggi.forEach(function(msg) {
                html += '<div style="background:var(--bg-card);border-radius:8px;border:0.5px solid var(--border);overflow:hidden;margin-bottom:0px">';
                
                // DATA + AUTORE STESSA RIGA
                html += '<div style="padding:10px 12px;border-left:3px solid var(--blue-mid);display:flex;justify-content:space-between;align-items:center">';
                html += '<div style="font-weight:600;font-size:13px;color:var(--text);text-transform:capitalize">' + dayName + ', ' + dayNum + ' ' + monthName + ' - 💬 ' + (msg.authorName || 'Allenatore') + '</div>';
                html += '</div>';
                
                // TESTO MESSAGGIO
                html += '<div style="padding:0 12px 10px 12px;color:var(--text);line-height:1.4;font-size:12px">';
                html += (msg.text || msg.messaggio || '');
                html += '<div style="margin-top:8px;display:flex;gap:6px">';
                html += '<button class="btn-remove" onclick="editMessage(\'' + msg.id + '\', \'' + categoria + '\', \'' + (msg.text || '').replace(/'/g, "\\'") + '\')">✏️ Modifica</button>';
                html += '<button class="btn-remove" onclick="deleteMessage(\'' + msg.id + '\', \'' + categoria + '\')">🗑️ Cancella</button>';
                html += '</div>';
                html += '</div>';
                
                html += '</div>';
              });
            }
          });
        });
      }
      
      html += '</div>';
      document.getElementById('attivita-list').innerHTML = html;
    }

    function closeModal() {
      var overlay = document.querySelector('.modal-overlay');
      if (overlay) overlay.remove();
      selectedActivityForMessage = null;
    }

    function saveMessage() {
      if (!selectedActivityForMessage) return;
      
      var messageText = document.getElementById('message-text').value.trim();
      if (!messageText) {
        alert('Scrivi un messaggio');
        return;
      }
      
      var categoria = selectedActivityForMessage.categoria;
      var dateStr = selectedActivityForMessage.dateStr;
      
      db.collection('eventMessages').doc(categoria).collection('messages').add({
        data: dateStr,
        category: categoria,
        authorName: currentUserData.profileData.nome,
        text: messageText,
        createdAt: firebase.firestore.Timestamp.now()
      }).then(function(docRef) {
        alert('Messaggio salvato! ✅');
        closeModal();
        loadAttivitaAllenatore(categoria);
      }).catch(function(err) {
        alert('Errore salvataggio: ' + err.message);
      });
    }

      html += '</div>';

    function saveEditMessage(msgId, categoria) {
      var newText = document.getElementById('edit-msg-text').value.trim();
      
      if (!newText) {
        alert('Scrivi un messaggio');
        return;
      }
      
      db.collection('eventMessages').doc(categoria).collection('messages').doc(msgId).update({
        text: newText,
        updatedAt: firebase.firestore.Timestamp.now()
      })
        .then(function() {
          alert('Messaggio aggiornato! ✅');
          closeModal();
          loadAttivitaAllenatore(categoria);
        })
        .catch(function(err) {
          alert('Errore: ' + err.message);
        });
    }

    function deleteMessage(msgId, categoria) {
      if (!confirm('Sei sicuro di voler cancellare questo messaggio?')) return;
      
      db.collection('eventMessages').doc(categoria).collection('messages').doc(msgId).delete()
        .then(function() {
          alert('Messaggio cancellato! 🗑️');
          loadAttivitaAllenatore(categoria);
        })
        .catch(function(err) {
          alert('Errore: ' + err.message);
        });
    }

    // ============ ADMIN ============
    function loadAdminStats() {
      db.collection('users').get().then(function(snap) {
        allUsers = [];
        var pending = 0;
        var atleti = 0;
        var allenatori = 0;
        var tuttiAtleti = 0;
        
        snap.docs.forEach(function(doc) {
          var data = Object.assign({ uid: doc.id }, doc.data());
          allUsers.push(data);
          
          if (data.status === 'pending_approval') pending++;
          if (data.role === 'atleta') atleti++;
          if (data.role === 'allenatore') allenatori++;
          if (data.atleti && Array.isArray(data.atleti)) {
            tuttiAtleti += data.atleti.length;
          }
        });
        
        document.getElementById('pending-count').innerText = pending;
        document.getElementById('users-count').innerText = allUsers.length;
        document.getElementById('atleti-count').innerText = tuttiAtleti;
        document.getElementById('allenatori-count').innerText = allenatori;
        
        // FIX v4.27: Carica approvazioni DOPO che i dati sono pronti
        loadApprovazioni();
      }).catch(function(err) {
        console.error('❌ Errore caricamento stats:', err);
      });
    }

    function loadAtletiAdmin() {
      var tuttiAtleti = [];
      
      allUsers.forEach(function(user) {
        if (user.atleti && Array.isArray(user.atleti)) {
          user.atleti.forEach(function(atleta) {
            tuttiAtleti.push({
              nome: atleta.nome,
              cognome: atleta.cognome,
              categoria: atleta.categoria,
              scadenza: atleta.scadenza || null,
              genitore: user.profileData.nome + ' ' + user.profileData.cognome,
              genitoreEmail: user.email,
              genitoreUid: user.uid,
              atleteIndex: user.atleti.indexOf(atleta)
            });
          });
        }
      });
      
      var html = '<h2>🏃 Atleti (' + tuttiAtleti.length + ')</h2>';
      
      if (tuttiAtleti.length === 0) {
        html += '<div style="padding:20px;text-align:center;color:var(--text-sec)">Nessun atleta registrato</div>';
      } else {
        tuttiAtleti.forEach(function(atleta) {
          var flagColor = '#16a34a';
          var flagEmoji = '🟢';
          var flagText = 'Valido';
          
          if (atleta.scadenza) {
            var scadDate = new Date(atleta.scadenza);
            var oggi = new Date();
            var diffMs = scadDate - oggi;
            var diffDays = Math.ceil(diffMs / (1000 * 60 * 60 * 24));
            
            if (diffDays < 0) {
              flagColor = '#dc2626';
              flagEmoji = '🔴';
              flagText = 'Scaduto';
            } else if (diffDays <= 30) {
              flagColor = '#FFC000';
              flagEmoji = '🟡';
              flagText = 'Scade in ' + diffDays + 'gg';
            } else {
              flagColor = '#16a34a';
              flagEmoji = '🟢';
              flagText = 'Valido';
            }
          }
          
          html += '<div class="user-item">';
          html += '<div class="user-info">';
          html += '<div class="user-name">';
          html += atleta.nome + ' ' + atleta.cognome;
          html += ' <span style="font-size:14px;margin-left:8px">' + flagEmoji + '</span>';
          html += '</div>';
          html += '<div class="user-meta">';
          html += 'Categoria: <strong>' + (CAT_LABELS[atleta.categoria] || atleta.categoria) + '</strong> • ';
          html += 'Genitore: ' + atleta.genitore + ' • ';
          html += '<span style="color:' + flagColor + ';font-weight:600">' + flagText + '</span>';
          if (atleta.scadenza) {
            html += ' (' + atleta.scadenza + ')';
          }
          html += '</div>';
          html += '</div>';
          html += '<div class="user-actions">';
          html += '<button class="btn-primary" onclick="editScadenzaAtleta(\'' + atleta.genitoreUid + '\', ' + atleta.atleteIndex + ', \'' + atleta.nome + '\', \'' + atleta.cognome + '\')">Scadenza</button>';
          html += '</div>';
          html += '</div>';
        });
      }
      
      document.getElementById('admin-content').innerHTML = html;
    }

          // FIX v4.28: Null checks per profileData
          var nome = (user.profileData && user.profileData.nome) ? user.profileData.nome : '[Nome non disponibile]';
          var cognome = (user.profileData && user.profileData.cognome) ? user.profileData.cognome : '';
          var catList = user.allenatore_categories && user.allenatore_categories.length > 0 ? user.allenatore_categories.map(function(c) { return CAT_LABELS[c] || c; }).join(', ') : 'Nessuna';
          
          html += '<div class="user-item">';
          html += '<div class="user-info">';
          html += '<div class="user-name">' + nome + ' ' + cognome + '</div>';
          html += '<div class="user-meta">' + user.email + ' • Categorie: ' + catList + '</div>';
          html += '</div>';
          html += '<div class="user-actions">';
          html += '<button class="btn-primary" onclick="editUser(\'' + user.uid + '\')">Modifica</button>';
          html += '</div>';
          html += '</div>';
        });
      }
      
      document.getElementById('admin-content').innerHTML = html;
    }

    function showRegistraAllenatore() {
      var html = '<div class="modal-overlay">';
      html += '<div class="modal">';
      html += '<button class="modal-close" onclick="closeModal()">✕</button>';
      html += '<div class="modal-header">Registra Nuovo Allenatore</div>';
      
      html += '<div class="form-group">';
      html += '<label class="form-label">Nome</label>';
      html += '<input type="text" id="reg-nome" placeholder="Nome">';
      html += '</div>';
      
      html += '<div class="form-group">';
      html += '<label class="form-label">Cognome</label>';
      html += '<input type="text" id="reg-cognome" placeholder="Cognome">';
      html += '</div>';
      
      html += '<div class="form-group">';
      html += '<label class="form-label">Email</label>';
      html += '<input type="email" id="reg-email" placeholder="email@example.com">';
      html += '</div>';
      
      html += '<div class="form-group">';
      html += '<label class="form-label">Password</label>';
      html += '<input type="password" id="reg-password" placeholder="Almeno 6 caratteri">';
      html += '</div>';
      
      html += '<div class="form-group">';
      html += '<label class="form-label">Categorie Allenatore</label>';
      html += '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">';
      
      ALL_CATEGORIES.forEach(function(cat) {
        html += '<label style="display:flex;align-items:center;margin-bottom:0">';
        html += '<input type="checkbox" id="cat-' + cat + '"> ';
        html += '<span style="margin-left:6px">' + (CAT_LABELS[cat] || cat) + '</span>';
        html += '</label>';
      });
      
      html += '</div>';
      html += '</div>';
      
      html += '<div style="display:flex;gap:12px">';
      html += '<button class="btn-secondary" onclick="closeModal()" style="flex:1">Annulla</button>';
      html += '<button class="btn-primary" onclick="saveRegistraAllenatore()" style="flex:1">Registra</button>';
      html += '</div>';
      html += '</div>';
      html += '</div>';
      
      document.getElementById('app').insertAdjacentHTML('beforeend', html);
    }

    function saveRegistraAllenatore() {
      var nome = document.getElementById('reg-nome').value.trim();
      var cognome = document.getElementById('reg-cognome').value.trim();
      var email = document.getElementById('reg-email').value.trim();
      var password = document.getElementById('reg-password').value;
      var categories = [];
      
      ALL_CATEGORIES.forEach(function(cat) {
        if (document.getElementById('cat-' + cat).checked) {
          categories.push(cat);
        }
      });
      
      if (!nome || !cognome || !email || !password) {
        alert('Compila tutti i campi');
        return;
      }
      
      if (password.length < 6) {
        alert('Password deve avere almeno 6 caratteri');
        return;
      }
      
      auth.createUserWithEmailAndPassword(email, password)
        .then(function(result) {
          var uid = result.user.uid;
          var userData = {
            uid: uid,
            email: email,
            role: 'allenatore',
            status: 'approved',
            profileData: { nome: nome, cognome: cognome },
            allenatore_categories: categories,
            createdAt: firebase.firestore.Timestamp.now()
          };
          
          return db.collection('users').doc(uid).set(userData).then(function() {
            return { uid: uid };
          });
        })
        .then(function(result) {
          alert('Allenatore registrato e approvato!');
          closeModal();
          
          // RE-LOGIN ADMIN (v4.10 fix!)
          loadAdminStats();
          showAdminDashboard();
        })
        .catch(function(error) {
          alert('Errore: ' + error.message);
        });
    }

    function editUser(uid) {
      var user = allUsers.find(function(u) { return u.uid === uid; });
      if (!user) return;
      
      var html = '<div class="modal-overlay">';
      html += '<div class="modal">';
      html += '<button class="modal-close" onclick="closeModal()">✕</button>';
      html += '<div class="modal-header">Modifica ' + (user.profileData ? user.profileData.nome : 'Utente') + '</div>';
      
      html += '<div class="form-group">';
      html += '<label class="form-label">Email</label>';
      html += '<div style="padding:8px;background:var(--bg-secondary);border-radius:8px;color:var(--text-sec)">' + user.email + '</div>';
      html += '</div>';
      
      html += '<div class="form-group">';
      html += '<label class="form-label">Ruolo</label>';
      html += '<select id="edit-role">';
      html += '<option value="atleta" ' + (user.role === 'atleta' ? 'selected' : '') + '>Atleta</option>';
      html += '<option value="allenatore" ' + (user.role === 'allenatore' ? 'selected' : '') + '>Allenatore</option>';
      html += '<option value="admin" ' + (user.role === 'admin' ? 'selected' : '') + '>Admin</option>';
      html += '</select>';
      html += '</div>';
      
      html += '<div class="form-group">';
      html += '<label class="form-label">Status</label>';
      html += '<select id="edit-status">';
      html += '<option value="pending_approval" ' + (user.status === 'pending_approval' ? 'selected' : '') + '>In attesa</option>';
      html += '<option value="approved" ' + (user.status === 'approved' ? 'selected' : '') + '>Approvato</option>';
      html += '</select>';
      html += '</div>';
      
      if (user.role === 'allenatore') {
        html += '<div class="form-group">';
        html += '<label class="form-label">Categorie Allenatore</label>';
        html += '<div style="display:grid;grid-template-columns:repeat(2,1fr);gap:8px">';
        
        var selectedCats = user.allenatore_categories || [];
        ALL_CATEGORIES.forEach(function(cat) {
          var isChecked = selectedCats.indexOf(cat) >= 0;
          html += '<label style="display:flex;align-items:center;margin-bottom:0">';
          html += '<input type="checkbox" id="cat-' + cat + '" ' + (isChecked ? 'checked' : '') + '> ';
          html += '<span style="margin-left:6px">' + (CAT_LABELS[cat] || cat) + '</span>';
          html += '</label>';
        });
        
        html += '</div>';
        html += '</div>';
      }
      
      html += '<div style="display:flex;gap:12px;margin-bottom:16px">';
      html += '<button class="btn-secondary" onclick="sendPasswordResetEmail(\'' + user.email + '\')" style="flex:1;background:#FF9800;color:white">🔑 Invia Reset Password</button>';
      html += '</div>';
      
      html += '<div style="display:flex;gap:12px">';
      html += '<button class="btn-secondary" onclick="closeModal()" style="flex:1">Annulla</button>';
      html += '<button class="btn-primary" onclick="saveUserEdit(\'' + uid + '\')" style="flex:1">Salva</button>';
      html += '</div>';
      html += '</div>';
      html += '</div>';
      
      document.getElementById('app').insertAdjacentHTML('beforeend', html);
    }

    // FIX v4.29: Invia email di reset password all'utente
    function sendPasswordResetEmail(email) {
      auth.sendPasswordResetEmail(email)
        .then(function() {
          alert('✅ Email di reset password inviata a: ' + email + '\n\nL\'utente potrà cliccare il link nell\'email per scegliere una nuova password.');
          closeModal();
        })
        .catch(function(error) {
          alert('❌ Errore nell\'invio: ' + error.message);
        });
    }

    function saveUserEdit(uid) {
      var role = document.getElementById('edit-role').value;
      var status = document.getElementById('edit-status').value;
      var categories = [];
      
      if (role === 'allenatore') {
        ALL_CATEGORIES.forEach(function(cat) {
          if (document.getElementById('cat-' + cat).checked) {
            categories.push(cat);
          }
        });
      }
      
      var updateData = {
        role: role,
        status: status
      };
      
      if (role === 'allenatore') {
        updateData.allenatore_categories = categories;
      }
      
      db.collection('users').doc(uid).update(updateData)
        .then(function() {
          alert('Utente aggiornato!');
          closeModal();
          loadAdminStats();
          loadUtenti();
        })
        .catch(function(err) {
          alert('Errore: ' + err.message);
        });
    }

    function editScadenzaAtleta(genitoreUid, atleteIndex, nome, cognome) {
      var user = allUsers.find(function(u) { return u.uid === genitoreUid; });
      if (!user || !user.atleti || !user.atleti[atleteIndex]) return;
      
      var atleta = user.atleti[atleteIndex];
      var scadenzaValue = atleta.scadenza || '';
      
      var html = '<div class="modal-overlay">';
      html += '<div class="modal">';
      html += '<button class="modal-close" onclick="closeModal()">✕</button>';
      html += '<div class="modal-header">Scadenza Certificato</div>';
      html += '<div style="margin-bottom:16px">';
      html += '<strong>' + nome + ' ' + cognome + '</strong>';
      html += '</div>';
      html += '<div class="form-group">';
      html += '<label class="form-label">Data Scadenza (YYYY-MM-DD)</label>';
      html += '<input type="date" id="scad-date" value="' + scadenzaValue + '">';
      html += '</div>';
      html += '<div style="display:flex;gap:12px">';
      html += '<button class="btn-secondary" onclick="closeModal()" style="flex:1">Annulla</button>';
      html += '<button class="btn-primary" onclick="saveScadenzaAtleta(\'' + genitoreUid + '\', ' + atleteIndex + ')" style="flex:1">Salva</button>';
      html += '</div>';
      html += '</div>';
      html += '</div>';
      
      document.getElementById('app').insertAdjacentHTML('beforeend', html);
    }

    function saveScadenzaAtleta(genitoreUid, atleteIndex) {
      var scadDate = document.getElementById('scad-date').value;
      
      var user = allUsers.find(function(u) { return u.uid === genitoreUid; });
      if (!user) return;
      
      var atleti = user.atleti || [];
      if (atleti[atleteIndex]) {
        atleti[atleteIndex].scadenza = scadDate;
      }
      
      db.collection('users').doc(genitoreUid).update({
        atleti: atleti
      })
        .then(function() {
          alert('Scadenza aggiornata!');
          closeModal();
          loadAdminStats();
          loadAtletiAdmin();
        })
        .catch(function(err) {
          alert('Errore: ' + err.message);
        });
    }

    function approveUser(uid) {
      db.collection('users').doc(uid).update({
        status: 'approved'
      })
        .then(function() {
          alert('Utente approvato!');
          loadAdminStats();
          loadApprovazioni();
        })
        .catch(function(err) {
          alert('Errore: ' + err.message);
        });
    }

    function rejectUser(uid) {
      if (!confirm('Sei sicuro di voler rifiutare questo utente?')) return;
      
      db.collection('users').doc(uid).delete()
        .then(function() {
          alert('Utente rifiutato e cancellato!');
          loadAdminStats();
          loadApprovazioni();
        })
        .catch(function(err) {
          alert('Errore: ' + err.message);
        });
    }

    async function downloadFileFromGoogleDrive(fileId) {
      try {
        const url = `https://docs.google.com/spreadsheets/d/${fileId}/export?format=xlsx`;
        const response = await fetch(url);
        if (!response.ok) throw new Error('Download failed');
        return await response.arrayBuffer();
      } catch (err) {
        console.error('Error downloading from Google Drive:', err);
        return null;
      }
    }

    auth.onAuthStateChanged(function(user) {
      if (user) {
        currentUser = user;
        loadUserData();
      } else {
        showLogin();
      }
    });
  </script>
</body>
</html>
