<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🔐 Ripristina Password - Sci Club Val d'Ayas</title>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            max-width: 500px;
            width: 100%;
            padding: 40px;
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            font-size: 24px;
            color: #333;
            margin-bottom: 8px;
        }

        .header p {
            font-size: 14px;
            color: #666;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 8px;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: #667eea;
        }

        .button {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
        }

        .button:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .message {
            margin-top: 20px;
            padding: 16px;
            border-radius: 8px;
            text-align: center;
            display: none;
            font-size: 14px;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        .message.info {
            background: #d1ecf1;
            color: #0c5460;
            border: 1px solid #bee5eb;
        }

        .info-box {
            background: #f0f4ff;
            border-left: 4px solid #667eea;
            padding: 16px;
            border-radius: 8px;
            margin-top: 20px;
            font-size: 13px;
            color: #555;
            line-height: 1.6;
        }

        .spinner {
            display: inline-block;
            width: 16px;
            height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: white;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            margin-right: 8px;
            vertical-align: middle;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #667eea;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link a:hover {
            text-decoration: underline;
        }

        .hidden {
            display: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔐 Ripristina Password</h1>
            <p>Sci Club Val d'Ayas</p>
        </div>

        <!-- FORM 1: Richiedi Reset -->
        <div id="requestForm" class="form-section">
            <form id="resetForm" onsubmit="handleRequestReset(event)">
                <div class="form-group">
                    <label for="email">Indirizzo Email</label>
                    <input
                        type="email"
                        id="email"
                        placeholder="tua-email@gmail.com"
                        required
                        autocomplete="email"
                    >
                </div>

                <button type="submit" class="button" id="submitBtn">
                    Invia Link Reset Password
                </button>
            </form>

            <div class="message" id="requestMessage"></div>

            <div class="info-box">
                <strong>📌 Come funziona:</strong><br>
                1. Inserisci l'email associata al tuo account<br>
                2. Riceverai una mail con un link di reset<br>
                3. Clicca il link entro 24 ore<br>
                4. Scegli una nuova password<br>
                5. Accedi con le nuove credenziali
            </div>

            <div class="back-link">
                <a href="https://sciclubvaldayas2026.github.io/sciclub-valdayas/">← Torna alla App</a>
            </div>
        </div>

        <!-- FORM 2: Resetta Password -->
        <div id="resetPasswordForm" class="form-section hidden">
            <form id="newPasswordForm" onsubmit="handleResetPassword(event)">
                <div class="message info" id="tokenMessage"></div>

                <div class="form-group">
                    <label for="newPassword">Nuova Password</label>
                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Inserisci nuova password"
                        required
                        minlength="8"
                    >
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Conferma Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Conferma password"
                        required
                        minlength="8"
                    >
                </div>

                <button type="submit" class="button" id="resetSubmitBtn">
                    Resetta Password
                </button>
            </form>

            <div class="message" id="resetMessage"></div>

            <div class="back-link">
                <a href="https://sciclubvaldayas2026.github.io/sciclub-valdayas/">← Torna alla App</a>
            </div>
        </div>
    </div>

    <script>
        // Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAchRy1dFQWGHlbUPZDnRPfV0fBQ9kSApM",
            authDomain: "sciclub-valdayas.firebaseapp.com",
            projectId: "sciclub-valdayas",
            storageBucket: "sciclub-valdayas.appspot.com",
            messagingSenderId: "941732445689",
            appId: "1:941732445689:web:25c7e8b9f8c3a2d1e4f5g6"
        };

        firebase.initializeApp(firebaseConfig);
        const auth = firebase.auth();
        const db = firebase.firestore();

        // Worker URL
        const WORKER_URL = 'https://sciclub-reset-password.sciclubvaldayas2026.workers.dev/';

        // Variabili globali
        let currentToken = null;
        let currentEmail = null;

        // Controlla URL al caricamento
        window.addEventListener('load', async () => {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const email = urlParams.get('email');

            if (token && email) {
                // Modalità reset password
                await verifyToken(token, email);
            } else {
                // Modalità richiesta reset
                document.getElementById('email').focus();
            }
        });

        /**
         * FORM 1: Richiedi Reset
         */
        async function handleRequestReset(event) {
            event.preventDefault();

            const email = document.getElementById('email').value.trim();
            const submitBtn = document.getElementById('submitBtn');
            const messageDiv = document.getElementById('requestMessage');

            messageDiv.className = 'message';
            messageDiv.textContent = '';

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span>Invio in corso...';

            try {
                // Chiama il Worker
                const response = await fetch(WORKER_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email: email })
                });

                const result = await response.json();

                if (result.success) {
                    messageDiv.className = 'message success';
                    messageDiv.innerHTML = `
                        ✅ <strong>Email inviata!</strong><br>
                        Controlla la tua email (compreso lo spam) per il link di reset.<br>
                        <small>Il link è valido per 24 ore.</small>
                    `;
                    document.getElementById('email').value = '';
                } else {
                    messageDiv.className = 'message error';
                    messageDiv.textContent = `❌ ${result.error}`;
                }

            } catch (error) {
                console.error('[RESET] Errore:', error);
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Errore di connessione. Riprova.';
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = 'Invia Link Reset Password';
            }
        }

        /**
         * FORM 2: Verifica Token e Resetta Password
         */
        async function verifyToken(token, email) {
            try {
                console.log('[RESET] Verifica token:', token, email);

                // Cerca il documento passwordResets
                const docRef = db.collection('passwordResets').doc(email.replace(/\./g, '_'));
                const doc = await docRef.get();

                if (!doc.exists) {
                    showTokenError('Token non valido o scaduto');
                    return;
                }

                const data = doc.data();

                // Verifica token
                if (data.token !== token) {
                    showTokenError('Token non valido');
                    return;
                }

                // Verifica scadenza
                const expiresAt = new Date(data.expiresAt);
                if (new Date() > expiresAt) {
                    showTokenError('Link scaduto (validità: 24 ore)');
                    return;
                }

                // Verifica se già usato
                if (data.used) {
                    showTokenError('Questo link è già stato usato');
                    return;
                }

                // Token valido!
                currentToken = token;
                currentEmail = email;

                document.getElementById('requestForm').classList.add('hidden');
                document.getElementById('resetPasswordForm').classList.remove('hidden');

                document.getElementById('tokenMessage').innerHTML = `
                    ✅ Token verificato! Inserisci la tua nuova password.
                `;

                document.getElementById('newPassword').focus();

            } catch (error) {
                console.error('[RESET] Errore verifica:', error);
                showTokenError('Errore nella verifica del token');
            }
        }

        /**
         * Resetta Password in Firebase Auth
         */
        async function handleResetPassword(event) {
            event.preventDefault();

            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;
            const submitBtn = document.getElementById('resetSubmitBtn');
            const messageDiv = document.getElementById('resetMessage');

            messageDiv.className = 'message';
            messageDiv.textContent = '';

            // Verifica che le password coincidano
            if (newPassword !== confirmPassword) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ Le password non coincidono';
                return;
            }

            // Verifica lunghezza minima
            if (newPassword.length < 8) {
                messageDiv.className = 'message error';
                messageDiv.textContent = '❌ La password deve avere almeno 8 caratteri';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spinner"></span>Reset in corso...';

            try {
                // Crea utente temporaneo e resetta password
                // Per fare questo, usiamo un account temporaneo e poi lo resettiamo

                // Opzione: Invia email di reset dal client
                // (L'utente non è autenticato, quindi usiamo il metodo sendPasswordResetEmail)

                // In realtà, dovremmo usare una Cloud Function per autenticare l'utente
                // Per ora, useremo il metodo sendSignInLinkToEmail di Firebase

                // Semplice soluzione: l'utente resetta direttamente in Firebase Auth
                // usando il link che Firebase genera

                // Aspetta, il token è generato da noi, non da Firebase
                // Quindi dobbiamo resettare l'utente in un modo diverso

                // Soluzione: Crea un documento con la nuova password criptata? No, non è sicuro.

                // Soluzione migliore: Chiediamo al genitore di fare il login con una password temporanea
                // e poi di cambiarla. Ma non sappiamo la password!

                // Soluzione finale: Inviamo un'email di reset UFFICIALE di Firebase
                // usando sendPasswordResetEmail() MA dal server (Cloud Function)

                // Per ora: Segniamo il token come "usato" in Firestore
                // e diciamo al genitore che riceverà un'email di reset UFFICIALE da Firebase

                // Oppure: Creiamo una nuova Cloud Function che resetta davvero la password

                // Per questo MVP, useremo un approccio semplice:
                // Segniamo il token come usato
                // E inviamo un'email di reset UFFICIALE di Firebase

                // Aggiungiamo il documento passwordResets che contiene il token
                await db.collection('passwordResets').doc(currentEmail.replace(/\./g, '_')).update({
                    used: true,
                    resetAt: new Date().toISOString()
                });

                // Ora inviamo un'email di reset ufficiale di Firebase
                // (Richiede che l'email sia registrata in Firebase Auth)
                await auth.sendPasswordResetEmail(currentEmail);

                messageDiv.className = 'message success';
                messageDiv.innerHTML = `
                    ✅ <strong>Email di reset inviata!</strong><br>
                    Controlla la tua email per il link di reset ufficiale di Firebase.<br>
                    <small>Clicca il link nell'email per resettare la password.</small>
                `;

                submitBtn.disabled = false;
                submitBtn.textContent = 'Resetta Password';

                setTimeout(() => {
                    window.location.href = 'https://sciclubvaldayas2026.github.io/sciclub-valdayas/';
                }, 3000);

            } catch (error) {
                console.error('[RESET] Errore reset:', error);
                messageDiv.className = 'message error';
                messageDiv.textContent = `❌ Errore: ${error.message}`;
                submitBtn.disabled = false;
                submitBtn.textContent = 'Resetta Password';
            }
        }

        /**
         * Mostra errore token
         */
        function showTokenError(message) {
            document.getElementById('requestForm').classList.add('hidden');
            document.getElementById('resetPasswordForm').classList.remove('hidden');

            const messageDiv = document.getElementById('tokenMessage');
            messageDiv.className = 'message error';
            messageDiv.innerHTML = `❌ ${message}<br><small><a href="https://sciclubvaldayas2026.github.io/sciclub-valdayas/password-reset.html">Riprova</a></small>`;

            document.getElementById('resetPasswordForm').querySelector('form').style.display = 'none';
        }
    </script>
</body>
</html>
